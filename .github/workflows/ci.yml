      # Last in the lane on purpose. A probing round is the round most likely to
      # be red, and a red probe should cost its own reading and nothing else.
      - timeout-minutes: 20
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          bash build.sh --tier=testing test/neutrinooffline.js test/neutrinooffline-default.cmd
          bash build.sh --tier=testing,offline test/neutrinooffline.js test/neutrinooffline.cmd
          TEST_EXIT=0
          bash test/verify-offline.sh test/neutrinooffline-default.cmd test/neutrinooffline.cmd \
            > ~/offline.log 2>&1 || TEST_EXIT=$?
          cat ~/offline.log
          bash test/annotate.sh kde-offline ~/offline.log 'report:|FAIL:'
          exit $TEST_EXIT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kde-screenshots
          path: |
            ~/screenshots/
            ~/netinstall-screenshots/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: bash build.sh test/neutrinotest.js test/neutrinotest.cmd
      - shell: bash
        run: bash test/parse.sh test/neutrinotest.cmd
      # The assembler, and the stamp it says it applied. Pure shell, no display
      # and about a second, so it runs beside parse.sh on every lane that
      # assembles anything -- and it has to run on all of them, because the
      # spelling of what it asserts is sed's and the three seds here are not the
      # same program. Every defect is measured against `oldbuild.sh`, the
      # assembler as it shipped through PR 23, carried inside the suite.
      #
      # Bounded, because the first version of it was not: it launched the
      # artifact and waited on it, this lane went from twelve minutes to fifty
      # and lost its runner, and a lane that dies publishes nothing -- so which
      # step blocked was not readable afterwards. The suite no longer starts
      # anything whose exit it does not control, and this is the second half of
      # that.
      - timeout-minutes: 5
        shell: bash
        run: |
          TEST_EXIT=0
          bash test/assemble.sh > ~/assemble.log 2>&1 || TEST_EXIT=$?
          cat ~/assemble.log
          bash test/annotate.sh windows-assemble ~/assemble.log 'report:|FAIL:|failure\(s\)'
          exit $TEST_EXIT
      # The Windows driver's own file and process I/O. Beside assemble.sh for
      # the same reason: it reads webview.cmd and compiles small programs, needs
      # no display and no artifact, and what it asserts is a spelling plus two
      # platform facts -- how CreateProcess resolves a bare program name, and
      # what this framework does to a junction. It launches no app and no
      # window, so nothing it starts can outlive the step.
      #
      # Windows only, because the mechanisms are.
      - timeout-minutes: 10
        shell: pwsh
        run: |
          & .\test\winexec.ps1 webview.cmd *>&1 | Tee-Object -FilePath "$HOME\winexec.log"
          exit $LASTEXITCODE
      - if: always()
        shell: bash
        run: bash test/annotate.sh windows-winexec ~/winexec.log 'report:|FAIL:'
      # The monolith launched a webview (appcache) before the neutrinotest
      # verify, so the WebView2 runtime's one-time cold init was already done.
      # Split into its own job, this is the cold launch, and the documented
      # Windows first-window stall lands on it far more often -- measured here,
      # netinstall 3/3 and core 1/2 against a historical 3/10. This restores the
      # precondition: launch a LOADERS webview -- the one appcache shows comes
      # up reliably cold -- wait for its window, and move on.
      - shell: bash
        run: bash build.sh --tier=testing test/neutrinoloaders.js test/neutrinowarm.cmd
      - name: warm the WebView2 runtime
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Best-effort: if the warm-up itself stalls it still triggered the
          # runtime init, and the real verify keeps its own 240s bound, so this
          # never fails the job. No pipe on the launcher -- the batch STARTs a
          # detached exe and exits, and a pipe would outlive it (PR 20/28).
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", ".\test\neutrinowarm.cmd" -PassThru -WindowStyle Hidden
          $i = 0
          for (; $i -lt 180; $i++) {
            if (Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like "LOADERS*" }) { break }
            Start-Sleep -Seconds 1
          }
          $state = if ($i -lt 180) { 'UP' } else { 'DOWN' }
          Write-Output "warm: window=$state after ${i}s"
          # Annotate only the miss: a warm-up that came up is the quiet case and
          # a warning every green run is noise. A DOWN means the runtime did not
          # warm and the real verify is about to run cold -- worth surfacing.
          if ($state -eq 'DOWN') { Write-Output "::warning title=warm::warm-up window never came up in ${i}s" }
          Get-Process | Where-Object { $_.MainWindowTitle -like "LOADERS*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "neutrinowarm" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0
      # The netinstall step below has had a timeout all along and this one has
      # not, so anything that fails to exit here stops the whole run rather
      # than the step. The app not exiting is exactly what a missing close
      # handler produced.
      - timeout-minutes: 20
        shell: pwsh
        run: |
          .\test\neutrinotest.cmd
          # Wrapped, because a verifier that leaves by exception takes the log
          # assembly below with it -- which is how three red runs published two
          # section headers and nothing else. The verifier no longer throws on a
          # timeout; this is here for the ones nobody has thought of.
          $testExit = 0
          try {
              & .\test\verify-windows.ps1 *>&1 | Tee-Object -FilePath "$HOME\windows-verify.log"
              $testExit = $LASTEXITCODE
          } catch {
              "FAIL: verify-windows.ps1 ended by exception: $($_.Exception.Message)" |
                  Tee-Object -FilePath "$HOME\windows-verify.log" -Append
              $testExit = 1
          }
          # The launcher's own account, appended to the verifier's so one
          # annotate carries both. This step went red twice saying only that it
          # had reached "Step 0" -- which is a section header and not a pass --
          # and the app's side of it was in a file nothing read. A refusal
          # writes `neutrino: ...` here before any window exists.
          $errLog = "test\neutrinotest\neutrino-error.log"
          if (Test-Path $errLog) {
              Add-Content "$HOME\windows-verify.log" "=== the app's own account ==="
              Add-Content "$HOME\windows-verify.log" (Get-Content $errLog)
          } else {
              Add-Content "$HOME\windows-verify.log" "=== the app recorded no failure of its own ==="
          }
          Get-Process | Where-Object { $_.MainWindowTitle -ne "" } | Where-Object { $_.MainWindowTitle -like "*neutrino*" -or $_.MainWindowTitle -like "*STEP*" -or $_.MainWindowTitle -like "*TESTS DONE*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $testExit
      # Carries the verifier's result out where a token cannot read the job
      # log. It once went red saying only that -- for four PRs it had no
      # annotate at all, and when it failed the suites that used to follow it in
      # the old single windows lane were skipped and reported missing logs. It
      # is its own job now, but the reading still has to leave by annotation.
      - if: always()
        shell: bash
        run: bash test/annotate.sh windows-test ~/windows-verify.log "PASS:|FAIL:|report:|^=== |^neutrino:"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screenshots
          path: |
            C:\Users\runneradmin\*.png
            C:\Users\runneradmin\netinstall-screenshots\

  windows-appcache:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The exe the batch region runs, which is now the one it just compiled.
      # Same finding as kde-appdir in a different mechanism: there the launcher
      # wrote the program every launch into a directory anyone could rewrite,
      # here it wrote it once and trusted a stamp beside it afterwards.
      - shell: bash
        run: bash build.sh --tier=testing test/neutrinoloaders.js test/neutrinocache.cmd
      - timeout-minutes: 30
        shell: pwsh
        run: |
          & .\test\appcache.ps1 .\test\neutrinocache.cmd *>&1 | Tee-Object -FilePath "$HOME\appcache.log"
          exit $LASTEXITCODE
      - if: always()
        shell: bash
        run: bash test/annotate.sh windows-appcache ~/appcache.log 'report:|FAIL:'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-appcache-screenshots
          path: |
            C:\Users\runneradmin\*.png
            C:\Users\runneradmin\netinstall-screenshots\

  windows-attack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: bash build.sh test/neutrinoattack.js test/neutrinoattack.cmd
      - timeout-minutes: 15
        shell: pwsh
        run: |
          .\test\neutrinoattack.cmd
          & .\test\verify-attack.ps1 *>&1 | Tee-Object -FilePath "$HOME\attack-verify.log"
          $testExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "ATTACK *" } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $testExit
      # The report line, carried out where it can be read without a token. This
      # was a Select-String written into the step above, the fifth hand-rolled
      # annotator in a file with four lanes; annotate.sh is what the other four
      # call and it produces a byte-identical annotation here -- measured, on
      # the same log, in the same run. What it adds is the cases the inline form
      # could not express, and they are exactly the ones a red lane produces: a
      # log that is not there, and a log that matched nothing.
      #
      # A note this lane was carrying and should not: `postnav=PENDING
      # nav=PENDING` here is not the earliest of several reports, and the
      # Select-Object -First 8 was not truncating anything. verify-attack.ps1
      # prints `report:` exactly once, after settling, and says in its own
      # comment that the settled report is not expected to arrive on this
      # platform because there is no navigation refusal to refuse with.
      # Measured: matched=1 reports=1.
      - if: always()
        shell: bash
        run: bash test/annotate.sh windows-attack ~/attack-verify.log 'report:|FAIL:'
      # The navigation lane. The Windows driver subscribes to NavigationStarting
      # and NewWindowRequested now, and this is the suite that says so: against
      # a target that answers, the driver without a guard reported
      # nav_arrived=YES and popup_arrived=YES opened=HANDLE, with the injected
      # API and the app author's own page script both present in the remote
      # document. test/neutrinoattack.js could never see this -- it aims at a
      # host that never resolves, which test/early-target.html's own comment
      # calls not a test, because the load fails on its own and a driver with a
      # guard reports the same "held" as one without.
      #
      # This suite, the attack suite and winerr now share the windows-attack
      # job rather than the whole windows lane: when they sat mid-lane a build
      # ahead of them failing skipped the assertion steps behind it, so pulling
      # the navigation and message surface into their own job is what keeps an
      # unrelated red from hiding whether these passed.
      - shell: bash
        run: bash build.sh test/neutrinonav.js test/neutrinonav.cmd
      - timeout-minutes: 15
        shell: pwsh
        run: |
          & .\test\verify-nav.ps1 .\test\neutrinonav.cmd "$HOME\navlogs" *>&1 |
            Tee-Object -FilePath "$HOME\navlogs-full.log"
          $navExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "NAV-*" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $navExit
      - if: always()
        shell: bash
        run: bash test/annotate.sh windows-nav ~/navlogs/nav.log 'report:|FAIL:'
      # A failed initialisation has to end, and has to leave a record. Both
      # halves were measured absent before this: the driver sat holding a modal
      # box ninety seconds after the download threw, and its app folder held
      # `neutrinoerr.exe`, its manifest and the build stamp and nothing that
      # named the failure. Provoked by pinning a version that does not exist, so
      # the package URL 404s and the download throws the way a digest mismatch
      # would -- the real path into handleError, with nothing about the driver
      # modified for the test.
      - shell: bash
        run: |
          bash build.sh test/neutrinotest.js test/neutrinoerr.cmd
          sed -i 's/webView2PinnedVersion: "[^"]*"/webView2PinnedVersion: "0.0.0-neutrino-does-not-exist"/' test/neutrinoerr.cmd
          grep -q 'webView2PinnedVersion: "0.0.0-neutrino-does-not-exist"' test/neutrinoerr.cmd
      - timeout-minutes: 10
        shell: pwsh
        run: |
          & .\test\verify-winerr.ps1 .\test\neutrinoerr.cmd *>&1 | Tee-Object -FilePath "$HOME\winerr-verify.log"
          $testExit = $LASTEXITCODE
          Get-Process -Name "neutrinoerr" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $testExit
      - if: always()
        shell: bash
        run: bash test/annotate.sh windows-winerr ~/winerr-verify.log 'report:|PASS:|FAIL:|failure\(s\)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-attack-screenshots
          path: |
            C:\Users\runneradmin\*.png
            C:\Users\runneradmin\netinstall-screenshots\

  windows-content:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The offline tier, which nothing in this repository has ever built.
      # `build.sh --tier=offline` says it denies the page network access, and
      # the whole mechanism is one meta tag applyContentPolicy swaps into the
      # extracted document. Its only assertion is parse.sh comparing two
      # strings; no engine has ever loaded a document carrying it. This step is
      # the measurement, and it asserts what three probing rounds read: nine
      # ways of reaching the network, none of which arrive under the tier and
      # all of which arrive under the one that permits them; and the route no
      # content policy can see, which is a url handed to the machine's browser
      # and which this PR closes.
      #
      # Two builds, one tier apart: the control carries `testing` and the app
      # under test carries `testing,offline`, so the only thing that differs
      # between the two readings is the policy in the document. The testing tier
      # is on both because macOS has no window a shell can query and writes its
      # title to a file only there.
      #
      # In the windows-content job with docswap and nothing else, so a red
      # reading here costs only its own job and not the rest of the suites.
      - shell: bash
        run: |
          bash build.sh --tier=testing test/neutrinooffline.js test/neutrinooffline-default.cmd
          bash build.sh --tier=testing,offline test/neutrinooffline.js test/neutrinooffline.cmd
      - timeout-minutes: 30
        shell: pwsh
        run: |
          & .\test\verify-offline.ps1 .\test\neutrinooffline-default.cmd .\test\neutrinooffline.cmd "$HOME\offlinelogs" *>&1 |
            Tee-Object -FilePath "$HOME\offlinelogs-full.log"
          $offExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "OFFLINE-*" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $offExit
      - if: always()
        shell: bash
        run: bash test/annotate.sh windows-offline ~/offlinelogs/offline.log 'report:|FAIL:'
      # PR 26, and the only lane it applies to. `boot` extracts the document,
      # applies the content policy and hands the result to `driver.loadHTML`;
      # this driver used to drop that argument, navigate to about:blank, and
      # read the file off NEUTRINO_SCRIPT_PATH a second time inside the event
      # loop to make another one. Measured: the gap between the two reads is
      # open from roughly half a second to under a second after the exe starts,
      # a file replaced inside it was the one that rendered, and a file removed
      # inside it left a window with no document and no account of why.
      #
      # The suite derives its own three builds from this one artifact -- two
      # markers apart, and one carrying the spelling this PR replaced -- so
      # "it would have failed before" runs on every push.
      #
      # `if: always()`: it shares the windows-content job with the offline
      # suite ahead of it, and a red there should not skip this build and hide
      # whether docswap passes -- the failure that once cost a whole round when
      # both sat in one long lane.
      - if: always()
        shell: bash
        run: bash build.sh --tier=testing test/neutrinodoc.js test/neutrinodoc.cmd
      - if: always()
        timeout-minutes: 30
        shell: pwsh
        run: |
          & .\test\docswap.ps1 .\test\neutrinodoc.cmd "$HOME\docswaplogs" *>&1 |
            Tee-Object -FilePath "$HOME\docswap-full.log"
          $swapExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "DOCSWAP*" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $swapExit
      - if: always()
        shell: bash
        run: bash test/annotate.sh windows-docswap ~/docswaplogs/docswap.log 'report:|FAIL:'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-content-screenshots
          path: |
            C:\Users\runneradmin\*.png
            C:\Users\runneradmin\netinstall-screenshots\

  windows-netinstall:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: netinstall suite
        timeout-minutes: 20
        shell: bash
        env:
          NETINSTALL_CC: zig cc
        run: |
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          # Redirected, and that is the whole of this comment. The batch region
          # STARTs a detached exe which inherits the standard handles, so with
          # the step's own pipe on the other end it stays open for as long as
          # the app lives -- and these apps are written never to close. Every
          # suite inside run.sh is bounded by nt_timeout, so the suite is reaped
          # and the orphan holding the pipe is not: the step then runs on past
          # its own timeout-minutes, measured at 37 minutes against a bound of
          # 20, and the rest of the lane never starts. A file has no reader to
          # wait on. The log is echoed afterwards by a process that does exit,
          # which is also what puts nt_result's ::warning lines back in front of
          # the runner -- redirecting without that would take the annotations
          # away with the hang.
          #
          # PR 20 wrote this lesson down for a probe that piped the launcher.
          # This is the step on this lane that never got it.
          NT_EXIT=0
          bash netinstall/test/run.sh > ~/netinstall.log 2>&1 || NT_EXIT=$?
          cat ~/netinstall.log
          exit $NT_EXIT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-netinstall-screenshots
          path: |
            C:\Users\runneradmin\*.png
            C:\Users\runneradmin\netinstall-screenshots\

  windows-exerace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Its own job, not a step at the tail of `windows`. The lane it used to
      # sit behind runs a dozen suites serially and this one launches the app
      # some forty times over three probing modes, so bolted on the end it was
      # half an hour nobody could overlap. Parallel, it costs wall-clock
      # nothing. Nothing here depends on the rest of the lane: it builds its own
      # artifact and measures the launch path's own file I/O.
      - shell: bash
        run: bash build.sh --tier=testing test/neutrinoloaders.js test/neutrinorace.cmd
      # The gap between the compile and the START, asserted shut. The batch
      # region MOVEs the freshly compiled exe onto a predictable name in the app
      # folder, writes a manifest, and only then STARTs it -- and appcache.ps1
      # measured that folder writable by everything running as this user. Three
      # probing rounds established the window is real in time (about 150 ms) and
      # shut in access: the name is open deny-write across all of it, and some
      # three hundred same-uid plant attempts a launch are refused every time,
      # rename ERROR_ACCESS_DENIED and overwrite ERROR_SHARING_VIOLATION. This
      # asserts none lands before the process starts, so the day a Windows
      # change opens the window the suite goes red and names the mode and round.
      - timeout-minutes: 30
        shell: pwsh
        run: |
          & .\test\exerace.ps1 .\test\neutrinorace.cmd *>&1 | Tee-Object -FilePath "$HOME\exerace.log"
          $raceExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "LOADERS*" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "neutrinorace" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $raceExit
      - if: always()
        shell: bash
        run: bash test/annotate.sh windows-exerace ~/exerace.log 'report:|FAIL:|failure\(s\)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-exerace-screenshots
          path: |
            C:\Users\runneradmin\*.png

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash build.sh --tier=testing test/neutrinotest.js test/neutrinotest.cmd
      - run: bash test/parse.sh test/neutrinotest.cmd
      # The assembler, and the stamp it says it applied. Pure shell, no display
      # and about a second, so it runs beside parse.sh on every lane that
      # assembles anything -- and it has to run on all of them, because the
      # spelling of what it asserts is sed's and the three seds here are not the
      # same program. Every defect is measured against `oldbuild.sh`, the
      # assembler as it shipped through PR 23, carried inside the suite.
      #
      # Bounded, because the first version of it was not: it launched the
      # artifact and waited on it, the Windows lane went from twelve minutes to
      # fifty and lost its runner, and a lane that dies publishes nothing -- so
      # which step blocked was not readable afterwards. The suite no longer
      # starts anything whose exit it does not control, and this is the second
      # half of that.
      - timeout-minutes: 5
        run: |
          TEST_EXIT=0
          bash test/assemble.sh > ~/assemble.log 2>&1 || TEST_EXIT=$?
          cat ~/assemble.log
          bash test/annotate.sh macos-assemble ~/assemble.log 'report:|FAIL:|failure\(s\)'
          exit $TEST_EXIT
      # The last step in any lane with no way to be read, and it cost a merge.
      # It went red publishing nothing at all: verify-macos.sh exits before its
      # first screenshot when the window does not appear, so the artifact upload
      # found nothing either, and the app's own account went to a log that was
      # catted into the job log and carried no further. Same treatment as the
      # other five, and the timeout the netinstall step has had all along.
      #
      # One annotate for both halves. The app's output is appended rather than
      # dumped into a step of its own, and matched on the `neutrino:` prefix the
      # launcher speaks in -- a raw dump is unbounded by construction and this
      # is not one.
      - timeout-minutes: 20
        run: |
          echo "=== Launching app ==="
          # The status file is one fixed path and every testing-tier build on
          # this lane writes it, the loaders step included. Cleared before the
          # launch and not inside the verifier, which would race the app it is
          # waiting for: a title left by the previous step is a reading
          # attributed to this one, and it looks exactly like a real one.
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinotest.cmd > ~/neutrino-stdout.log 2>&1 &
          APP_PID=$!
          # Steps run under bash -e, so a failing verifier aborts this block
          # where it stands. Written as "cmd; VAR=$?" the app's output below is
          # unreachable on exactly the runs that need it, which is why the last
          # one reported a window and nothing else.
          TEST_EXIT=0
          APP_PID=$APP_PID bash test/verify-macos.sh ~/screenshots \
            > ~/macos-verify.log 2>&1 || TEST_EXIT=$?
          kill "$APP_PID" 2>/dev/null || true
          cat ~/macos-verify.log
          echo "=== app output ==="
          cat ~/neutrino-stdout.log || true
          {
            echo "=== the app's own account ==="
            cat ~/neutrino-stdout.log 2>/dev/null || true
          } >> ~/macos-verify.log
          bash test/annotate.sh macos-test ~/macos-verify.log 'PASS:|FAIL:|report:|^=== |^neutrino:'
          exit $TEST_EXIT
      # The tight tier: webview.cmd confining its own process, whether or not
      # netinstall launched it. Asserted from both sides -- the webview has to
      # survive the profile, and the profile has to refuse something -- because
      # either half alone passes for the wrong reason.
      - run: |
          bash build.sh --tier=testing,tight test/neutrinotest.js test/neutrinotight.cmd
          # This lane reported to its job log and called nothing that carried
          # the result out, so a red tight tier said FAILURES=0 is false and
          # nothing finer -- the gap PR 7 and PR 8 both parked here. The third
          # argument is not optional: this verifier speaks in PASS/FAIL and
          # annotate.sh's stock `report:|FAIL:` pattern matches nothing at all
          # in its output. Measured, on the real log: 43 lines, 18 of them
          # caught by the pattern below and none by the default, packing into
          # four annotations against a cap of eight.
          TIGHT_EXIT=0
          bash test/verify-macos-tight.sh test/neutrinotight.cmd ~/screenshots \
            > ~/tight.log 2>&1 || TIGHT_EXIT=$?
          cat ~/tight.log
          bash test/annotate.sh macos-tight ~/tight.log 'PASS:|FAIL:|failure\(s\)'
          exit $TIGHT_EXIT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-screenshots
          path: |
            ~/screenshots/

  macos-loaders:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The loader environment the standalone launch path hands its engine.
      # Every check here is against the same build with the fix cut out of it,
      # so "it would have failed before" is measured in this run rather than
      # claimed. Two builds go in: the testing tier, because the suite has to
      # know the app came up and on two lanes that is scaffolding -- the macOS
      # driver writes its title to a file only there, and Qt's Chromium needs
      # the no-sandbox flag this container cannot do without -- and the default
      # tier, which is the only build the sandbox section can ask its question
      # of, since the testing tier is what puts --no-sandbox on the command
      # line. Neither tier touches the environment.
      - timeout-minutes: 25
        run: |
          bash build.sh --tier=testing test/neutrinoloaders.js test/neutrinoloaders.cmd
          TEST_EXIT=0
          bash test/loaders.sh test/neutrinoloaders.cmd > ~/loaders.log 2>&1 || TEST_EXIT=$?
          cat ~/loaders.log
          bash test/annotate.sh macos-loaders ~/loaders.log 'report:|FAIL:'
          exit $TEST_EXIT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-loaders-screenshots
          path: |
            ~/screenshots/

  macos-behavior:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash build.sh --tier=testing test/neutrinoattack.js test/neutrinoattack.cmd
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinoattack.cmd > ~/neutrino-attack.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-attack.sh > ~/attack-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoattack 2>/dev/null || true
          cat ~/attack-verify.log
          echo "=== app output ==="
          cat ~/neutrino-attack.log || true
          bash test/annotate.sh macos-attack ~/attack-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      # Recorded here rather than asserted: this driver has no navigation
      # delegate to arm at all, which is PR 6's business. The testing tier is
      # what writes the status file the verifier reads.
      - run: |
          python3 test/stall.py 8099 > ~/stall.log 2>&1 &
          STALL_PID=$!
          # Where the page under test navigates to. It has to answer: with a
          # host that never resolves the navigation fails on its own and every
          # driver reports "held", guard or no guard -- measured on macOS.
          # This does not return until it is serving, so the app below cannot
          # navigate into a port nothing has bound yet.
          PAGES_PID="$(bash test/serve-target.sh ~/pages.log)"
          bash build.sh --tier=testing test/neutrinoearly.js test/neutrinoearly.cmd
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinoearly.cmd > ~/early.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-early.sh > ~/early-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoearly 2>/dev/null || true
          kill "$STALL_PID" 2>/dev/null || true
          kill "$PAGES_PID" 2>/dev/null || true
          cat ~/early-verify.log
          echo "=== app output ==="
          cat ~/early.log || true
          bash test/annotate.sh macos-early ~/early-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      # The navigation guard PR 6 built, and the account it gives of itself.
      #
      # It shipped spelled `webViewRef.stopLoading()`, and JXA runs a
      # zero-argument selector when the property is read -- so the read stopped
      # the load and the `()` after it threw, and for four PRs the guard refused
      # every navigation and logged that it could not. Nothing here could catch
      # that: verify-attack.sh aims at a host that never resolves, so its `nav`
      # field is free whatever the guard does, and verify-early.sh asserts
      # `at=held` with no control -- and `held` was the reading before the fix
      # and after it, because the guard was working the whole time.
      #
      # So this asserts the effect and the account separately, against a control
      # that is this artifact with the refusal deleted and against the spelling
      # the fix replaced. Three launches of the same build, one line apart.
      - timeout-minutes: 20
        run: |
          bash build.sh --tier=testing test/neutrinoearly.js test/neutrinonavrefuse.cmd
          TEST_EXIT=0
          bash test/navrefuse.sh test/neutrinonavrefuse.cmd > ~/navrefuse.log 2>&1 || TEST_EXIT=$?
          cat ~/navrefuse.log
          bash test/annotate.sh macos-navrefuse ~/navrefuse.log 'report:|FAIL:|PASS:|NOTE:'
          exit $TEST_EXIT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-behavior-screenshots
          path: |
            ~/screenshots/

  macos-net:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: netinstall suite
        timeout-minutes: 20
        run: |
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          bash netinstall/test/run.sh
      # The offline tier, which nothing in this repository has ever built.
      # `build.sh --tier=offline` says it denies the page network access, and
      # the whole mechanism is one meta tag applyContentPolicy swaps into the
      # extracted document. Its only assertion is parse.sh comparing two
      # strings; no engine has ever loaded a document carrying it. This step is
      # the measurement, and it asserts what three probing rounds read: nine
      # ways of reaching the network, none of which arrive under the tier and
      # all of which arrive under the one that permits them; and the route no
      # content policy can see, which is a url handed to the machine's browser
      # and which this PR closes.
      #
      # Two builds, one tier apart: the control carries `testing` and the app
      # under test carries `testing,offline`, so the only thing that differs
      # between the two readings is the policy in the document. The testing tier
      # is on both because macOS has no window a shell can query and writes its
      # title to a file only there.
      #
      # Last in the lane on purpose. A probing round is the round most likely to
      # be red, and a red probe should cost its own reading and nothing else.
      - timeout-minutes: 20
        run: |
          bash build.sh --tier=testing test/neutrinooffline.js test/neutrinooffline-default.cmd
          bash build.sh --tier=testing,offline test/neutrinooffline.js test/neutrinooffline.cmd
          TEST_EXIT=0
          bash test/verify-offline.sh test/neutrinooffline-default.cmd test/neutrinooffline.cmd \
            > ~/offline.log 2>&1 || TEST_EXIT=$?
          cat ~/offline.log
          bash test/annotate.sh macos-offline ~/offline.log 'report:|FAIL:'
          exit $TEST_EXIT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-net-screenshots
          path: |
            ~/screenshots/
            ~/netinstall-screenshots/

  openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Pinned to the commit v1.4.6 points at, on the same terms as everything
      # else this branch pinned: a tag is a name its owner can move.
      - name: netinstall suite
        id: vm
        continue-on-error: true
        uses: vmactions/openbsd-vm@e6c68b637a12e83519688d115d57d5b0b53923cd
        with:
          usesh: true
          copyback: true
          # bash and curl are what the suite runs on; python3 is what serves the
          # payloads and drives the network probes. The image carries the rest --
          # seq, timeout, perl and sha256(1), which lib.sh now knows about
          # because this platform ships neither sha256sum nor shasum.
          #
          # wget is here for fetchbound.sh alone. It is the branch whose two
          # bounds come from the kernel rather than from the downloader, and
          # without it installed this lane skips every assertion about them --
          # on the one platform in the matrix with a different libc and a
          # different kernel, which is exactly where setrlimit and sigaction
          # are worth asking twice.
          prepare: |
            pkg_add -I bash curl wget || true
            pkg_add -I python3 || pkg_add -I python%3 || true
          # The log comes back rather than going to the job log: reading a job
          # log needs a token and reading annotations does not, which is the
          # same reason annotate.sh exists for the webview lanes.
          #
          # `&& rc=0 || rc=$?` and not a bare `$?`: vmactions pipes this script
          # to `sh` behind a literal `set -eu` (index.js, `const fullCmd`), and
          # run.sh exits with its failure count -- so the first red suite would
          # abort the script before the rc file is written, and the action skips
          # copyback entirely when the ssh command returns non-zero. This lane
          # has only ever been green, which is the only reason it has not
          # already lost a log to it. The `exit 0` is what keeps the ssh command
          # successful; the outcome step below is what fails the lane.
          run: |
            bash netinstall/test/run.sh > openbsd-suite.log 2>&1 && rc=0 || rc=$?
            echo "$rc" > openbsd-suite.rc
            exit 0
      # `report:` is in the pattern because a suite's nt_result never leaves this
      # lane on its own: the `::warning` it writes is written inside the VM,
      # where GitHub is not listening, and arrives here as a line in a log file.
      # Anchored to the plain echo so the smuggled `::warning` copy of the same
      # line is not annotated twice.
      - name: results
        if: always()
        run: bash test/annotate.sh openbsd openbsd-suite.log 'FAIL:|failure\(s\)|SKIP|^ +report:'
      - name: outcome
        if: always()
        run: |
          [ "${{ steps.vm.outcome }}" = "success" ] ||
            echo "::error title=openbsd::the vm step itself did not complete"
          exit "$(cat openbsd-suite.rc 2>/dev/null || echo 1)"
  # PR 11 put the __OpenBSD__ half of netinstall/sandbox_bsd.c under a lane and
  # found four of its rules wrong. The other half -- FreeBSD, NetBSD -- has
  # still never been compiled by anything in this repository: build.sh
  # cross-compiles six targets and none of them is a BSD, and the lane above
  # compiles the branch this one does not. Meanwhile the suites grew
  # FreeBSD|NetBSD arms written from the OpenBSD reading -- phases.sh wants
  # "unveil" on the --info fetch line, fetchconf.sh wants it in the config line
  # -- on two platforms whose nt_confine returns -1 and says "none". PR 11
  # parked these with "a lane written blind is worse", and the blind arms are
  # already in the tree. These two lanes ask.
  #
  # bsdfloor.sh runs first and gets an annotate step of its own. It asserts
  # nothing and always exits 0, which is what lets it go in front of a suite
  # whose whole question is whether anything downstream of it can build at all;
  # the cap is per step, so its readings do not compete with the suite's.
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Pinned to the commit v1.5.5 points at, on the same terms as the openbsd
      # lane beside it: a tag is a name its owner can move.
      - name: netinstall suite
        id: vm
        continue-on-error: true
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1
        with:
          usesh: true
          copyback: true
          # The packages are installed in `run` and not in `prepare`, because
          # `prepare` goes over the same `set -eu` ssh channel and its output
          # lands only in the job log, which needs a token to read. Round 2's
          # netbsd lane installed nothing and the only way anyone found out was
          # that bsdfloor listed curl among the missing. A log that comes back
          # is the difference between that and a sentence.
          prepare: |
            true
          # See the openbsd lane above for why the rc is captured this way and
          # why the script ends at 0: round 1 lost both logs and every reading
          # to exactly that, on both lanes.
          run: |
            {
              pkg install -y bash curl wget || true
              pkg install -y python3 || true
              echo "--- after ---"
              for t in bash cc curl wget python3; do
                printf 'tool %s ' "$t"; command -v "$t" || echo missing
              done
              printf 'tool python3 says '; python3 -V 2>&1 || echo missing
            } > bsd-pkg.log 2>&1 || true
            bash netinstall/test/bsdfloor.sh > bsd-probe.log 2>&1 && rc=0 || rc=$?
            echo "$rc" > bsd-probe.rc
            bash netinstall/test/run.sh > bsd-suite.log 2>&1 && rc=0 || rc=$?
            echo "$rc" > bsd-suite.rc
            exit 0
      - name: probe results
        if: always()
        run: bash test/annotate.sh freebsd-probe bsd-probe.log '^ +report:|^ +FAIL:|SKIP:'
      - name: packages
        if: always()
        run: bash test/annotate.sh freebsd-pkg bsd-pkg.log 'missing|not found|rror|^tool '
      # Three steps over the suite log, because the cap is per step and round 2
      # dropped four chunks from the middle of the failures alone. Anchored to
      # the plain `  FAIL:` echo, not to /FAIL:/ -- nt_fail prints the same
      # sentence twice, once for a reader and once as an ::error, and matching
      # both halved the number of distinct failures that fit.
      - name: results
        if: always()
        env:
          NT_ANNOTATE_PER: "12"
        run: bash test/annotate.sh freebsd bsd-suite.log '^ +FAIL:'
      - name: readings
        if: always()
        env:
          NT_ANNOTATE_PER: "12"
        run: bash test/annotate.sh freebsd-readings bsd-suite.log 'SKIP|^ +report:'
      # Most of what this lane counts as failures are suites exiting 2 without
      # printing a FAIL line at all -- a setup that did not come up, not an
      # assertion that did not hold. Those two are different problems and the
      # results step above cannot see the first one.
      - name: errors
        if: always()
        env:
          NT_ANNOTATE_PER: "12"
        run: bash test/annotate.sh freebsd-errors bsd-suite.log 'not found|No such file|Traceback|Permission denied|never came up|cannot create|^### |^ +(interpreter|still running|poller|it said)'
      - name: totals
        if: always()
        run: bash test/annotate.sh freebsd-totals bsd-suite.log '^### Total|[.]sh. [0-9]+ failure'
      # bsdfloor gates three answers of its own now -- that the branch compiles,
      # which sysctl spelling this kernel answers, and whether the no-new-privs
      # floor is one -- so its rc counts. `absent` when it never got as far as
      # writing the file, which is a different failure from a red assertion and
      # is left saying so rather than folded into a number.
      - name: outcome
        if: always()
        run: |
          [ "${{ steps.vm.outcome }}" = "success" ] ||
            echo "::error title=freebsd::the vm step itself did not complete"
          probe="$(cat bsd-probe.rc 2>/dev/null || echo absent)"
          echo "::warning title=freebsd::probe rc=$probe"
          [ "$probe" = "0" ] ||
            echo "::error title=freebsd::bsdfloor reported $probe failure(s)"
          suite="$(cat bsd-suite.rc 2>/dev/null || echo 1)"
          [ "$suite" = "0" ] && [ "$probe" = "0" ] || exit 1
          exit 0
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Pinned to the commit v1.4.7 points at.
      - name: netinstall suite
        id: vm
        continue-on-error: true
        uses: vmactions/netbsd-vm@6334c835de4c04a59fe59f0f8f071e02a2f0bab3
        with:
          usesh: true
          copyback: true
          # pkgsrc installs under /usr/pkg, and its python is versioned: the
          # package is python3NN and what lands on disk is python3.NN, which is
          # not a name lib.sh's nt_python knows. The symlink is made here rather
          # than taught to lib.sh, because whether this platform needs teaching
          # is one of the things the round is asking.
          # Nothing here: see the freebsd lane above. Round 2 installed not one
          # package on this lane and said so nowhere.
          prepare: |
            true
          run: |
            PATH=/usr/pkg/bin:/usr/pkg/sbin:$PATH
            export PATH
            {
              command -v pkgin || echo "no pkgin"
              command -v pkg_add || echo "no pkg_add"
              pkgin -y update || true
              pkgin -y install curl wget || true
              pkgin -y install python312 || pkgin -y install python311 || true
              pkg_add curl wget python312 || true
              # pkgsrc's python is versioned -- the package is python3NN and
              # what lands is python3.NN, which is not a name lib.sh knows.
              #
              # The glob is anchored on purpose. `python3.*` also matches
              # python3.12-config, which is what this linked in round 6, and
              # nt_serve then started it eleven times and read
              # `Usage: /usr/pkg/bin/python3 --prefix` -- reported as eleven
              # suites whose fixture never came up. And the interpreter is asked
              # to interpret before it is believed, because a name that exists
              # and a program that runs are different claims.
              for p in /usr/pkg/bin/python3.[0-9] /usr/pkg/bin/python3.[0-9][0-9]; do
                if [ -x "$p" ] && "$p" -c "import http.server" >/dev/null 2>&1; then
                  ln -sf "$p" /usr/pkg/bin/python3
                fi
              done
              echo "--- after ---"
              for t in bash cc curl wget python3; do
                printf 'tool %s ' "$t"; command -v "$t" || echo missing
              done
              printf 'tool python3 says '; python3 -V 2>&1 || echo missing
            } > bsd-pkg.log 2>&1 || true
            bash netinstall/test/bsdfloor.sh > bsd-probe.log 2>&1 && rc=0 || rc=$?
            echo "$rc" > bsd-probe.rc
            bash netinstall/test/run.sh > bsd-suite.log 2>&1 && rc=0 || rc=$?
            echo "$rc" > bsd-suite.rc
            exit 0
      - name: probe results
        if: always()
        run: bash test/annotate.sh netbsd-probe bsd-probe.log '^ +report:|^ +FAIL:|SKIP:'
      - name: packages
        if: always()
        run: bash test/annotate.sh netbsd-pkg bsd-pkg.log 'missing|not found|rror|^tool '
      # Three steps over the suite log, because the cap is per step and round 2
      # dropped four chunks from the middle of the failures alone. Anchored to
      # the plain `  FAIL:` echo, not to /FAIL:/ -- nt_fail prints the same
      # sentence twice, once for a reader and once as an ::error, and matching
      # both halved the number of distinct failures that fit.
      - name: results
        if: always()
        env:
          NT_ANNOTATE_PER: "12"
        run: bash test/annotate.sh netbsd bsd-suite.log '^ +FAIL:'
      - name: readings
        if: always()
        env:
          NT_ANNOTATE_PER: "12"
        run: bash test/annotate.sh netbsd-readings bsd-suite.log 'SKIP|^ +report:'
      # Most of what this lane counts as failures are suites exiting 2 without
      # printing a FAIL line at all -- a setup that did not come up, not an
      # assertion that did not hold. Those two are different problems and the
      # results step above cannot see the first one.
      - name: errors
        if: always()
        env:
          NT_ANNOTATE_PER: "12"
        run: bash test/annotate.sh netbsd-errors bsd-suite.log 'not found|No such file|Traceback|Permission denied|never came up|cannot create|^### |^ +(interpreter|still running|poller|it said)'
      - name: totals
        if: always()
        run: bash test/annotate.sh netbsd-totals bsd-suite.log '^### Total|[.]sh. [0-9]+ failure'
      - name: outcome
        if: always()
        run: |
          [ "${{ steps.vm.outcome }}" = "success" ] ||
            echo "::error title=netbsd::the vm step itself did not complete"
          probe="$(cat bsd-probe.rc 2>/dev/null || echo absent)"
          echo "::warning title=netbsd::probe rc=$probe"
          [ "$probe" = "0" ] ||
            echo "::error title=netbsd::bsdfloor reported $probe failure(s)"
          suite="$(cat bsd-suite.rc 2>/dev/null || echo 1)"
          [ "$suite" = "0" ] && [ "$probe" = "0" ] || exit 1
          exit 0
  netinstall-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: bash netinstall/build.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: netinstall-binaries
          path: netinstall/dist/
