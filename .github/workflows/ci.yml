name: CI
on: [push]
jobs:
  gjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt update
          sudo apt install -y xvfb gjs imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy \
            gir1.2-webkit2-4.1 \
            || sudo apt install -y xvfb gjs imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy \
            gir1.2-webkit2-4.0
      # Ubuntu refuses unprivileged user namespaces by default, so WebKitGTK's
      # sandbox cannot start and neutrino correctly declines to ask for it.
      # That leaves the sandboxed path unexercised on the only machine that
      # runs this suite, so lift the knob here -- netinstall's own suite does
      # the same thing for the same reason. Nothing shipped may do this; it is
      # root's decision, and a test is the only thing entitled to make it.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: bash build.sh test/neutrinotest.js test/neutrinotest.cmd
      - run: bash test/parse.sh test/neutrinotest.cmd
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3
          metacity &
          sleep 2
          xsetroot -solid "#112233"
          bash test/neutrinotest.cmd &
          APP_PID=$!
          bash test/verify-linux.sh ~/screenshots
          TEST_EXIT=$?
          kill "$APP_PID" 2>/dev/null || true
          exit $TEST_EXIT
      # The app under test here is hostile page content. Built at the default
      # tier on purpose: this lane is what says the shipped configuration
      # refuses these, not a configuration assembled for the test.
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; metacity >/dev/null 2>&1 & sleep 2; }
          bash build.sh test/neutrinoattack.js test/neutrinoattack.cmd
          bash test/neutrinoattack.cmd > ~/attack.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-attack.sh > ~/attack-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoattack 2>/dev/null || true
          cat ~/attack-verify.log
          bash test/annotate.sh gjs-attack ~/attack-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      # A page that navigates before its own load has finished. Built at the
      # default tier for the same reason the attack app is: this lane is what
      # says the shipped configuration holds, not a configuration assembled for
      # the test. stall.py is what keeps the document's load pending, which is
      # what puts the guard under test instead of a race -- the verifier
      # asserts the document really was still loading, so a listener that did
      # not come up is a failure and not a quiet pass.
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; metacity >/dev/null 2>&1 & sleep 2; }
          python3 test/stall.py 8099 > ~/stall.log 2>&1 &
          STALL_PID=$!
          # Where the page under test navigates to. It has to answer: with a
          # host that never resolves the navigation fails on its own and every
          # driver reports "held", guard or no guard -- measured on macOS.
          # This does not return until it is serving, so the app below cannot
          # navigate into a port nothing has bound yet.
          PAGES_PID="$(bash test/serve-target.sh ~/pages.log)"
          bash build.sh test/neutrinoearly.js test/neutrinoearly.cmd
          bash test/neutrinoearly.cmd > ~/early.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-early.sh > ~/early-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoearly 2>/dev/null || true
          kill "$STALL_PID" 2>/dev/null || true
          kill "$PAGES_PID" 2>/dev/null || true
          cat ~/early-verify.log
          bash test/annotate.sh gjs-early ~/early-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      - name: netinstall suite
        timeout-minutes: 35
        run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; metacity >/dev/null 2>&1 & sleep 2; }
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          bash netinstall/test/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gjs-screenshots
          path: |
            ~/screenshots/
            ~/netinstall-screenshots/
  kde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt update
          sudo apt install -y xvfb imagemagick x11-xserver-utils x11-utils mesa-utils libgl1-mesa-dri libegl-mesa0 openbox \
            xdotool xauth dbus \
            qt6-declarative-dev-tools qml6-module-qtwebengine qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
          if ! command -v qml6 >/dev/null 2>&1 && ! command -v qml >/dev/null 2>&1 && ! command -v qmlscene6 >/dev/null 2>&1 && ! command -v qmlscene-qt6 >/dev/null 2>&1; then
            sudo apt install -y qml6 || sudo apt install -y qml-qt6 || sudo apt install -y qmlscene-qt6 || true
          fi
      - run: bash build.sh --tier=testing test/neutrinotest.js test/neutrinotest.cmd
      - run: bash test/parse.sh test/neutrinotest.cmd
      - run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3
          openbox &
          sleep 2
          xsetroot -solid "#112233"
          dbus-run-session -- bash test/neutrinotest.cmd &
          APP_PID=$!
          bash test/verify-linux.sh ~/screenshots
          TEST_EXIT=$?
          kill "$APP_PID" 2>/dev/null || true
          exit $TEST_EXIT
      # The app under test here is hostile page content. Built at the default
      # tier on purpose: this lane is what says the shipped configuration
      # refuses these, not a configuration assembled for the test.
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          bash build.sh test/neutrinoattack.js test/neutrinoattack.cmd
          bash test/neutrinoattack.cmd > ~/attack.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-attack.sh > ~/attack-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoattack 2>/dev/null || true
          cat ~/attack-verify.log
          bash test/annotate.sh kde-attack ~/attack-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      # A page that navigates before its own load has finished. Built at the
      # default tier for the same reason the attack app is: this lane is what
      # says the shipped configuration holds, not a configuration assembled for
      # the test. stall.py is what keeps the document's load pending, which is
      # what puts the guard under test instead of a race -- the verifier
      # asserts the document really was still loading, so a listener that did
      # not come up is a failure and not a quiet pass.
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          python3 test/stall.py 8099 > ~/stall.log 2>&1 &
          STALL_PID=$!
          # Where the page under test navigates to. It has to answer: with a
          # host that never resolves the navigation fails on its own and every
          # driver reports "held", guard or no guard -- measured on macOS.
          # This does not return until it is serving, so the app below cannot
          # navigate into a port nothing has bound yet.
          PAGES_PID="$(bash test/serve-target.sh ~/pages.log)"
          bash build.sh test/neutrinoearly.js test/neutrinoearly.cmd
          bash test/neutrinoearly.cmd > ~/early.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-early.sh > ~/early-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoearly 2>/dev/null || true
          kill "$STALL_PID" 2>/dev/null || true
          kill "$PAGES_PID" 2>/dev/null || true
          cat ~/early-verify.log
          bash test/annotate.sh kde-early ~/early-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      - name: netinstall suite
        timeout-minutes: 35
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export QTWEBENGINE_DISABLE_SANDBOX=1
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          dbus-run-session -- bash netinstall/test/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kde-screenshots
          path: |
            ~/screenshots/
            ~/netinstall-screenshots/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: bash build.sh test/neutrinotest.js test/neutrinotest.cmd
      - shell: bash
        run: bash test/parse.sh test/neutrinotest.cmd
      # The netinstall step below has had a timeout all along and this one has
      # not, so anything that fails to exit here stops the whole run rather
      # than the step. The app not exiting is exactly what a missing close
      # handler produced.
      - timeout-minutes: 15
        shell: pwsh
        run: |
          .\test\neutrinotest.cmd
          & .\test\verify-windows.ps1
          $testExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -ne "" } | Where-Object { $_.MainWindowTitle -like "*neutrino*" -or $_.MainWindowTitle -like "*STEP*" -or $_.MainWindowTitle -like "*TESTS DONE*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $testExit
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - shell: bash
        run: bash build.sh test/neutrinoattack.js test/neutrinoattack.cmd
      - timeout-minutes: 15
        shell: pwsh
        run: |
          .\test\neutrinoattack.cmd
          & .\test\verify-attack.ps1 *>&1 | Tee-Object -FilePath "$HOME\attack-verify.log"
          $testExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "ATTACK *" } | Stop-Process -Force -ErrorAction SilentlyContinue
          # PR 5 probing. This lane changes nothing, but it reports the new
          # postnav field like every other, and a field nobody can read is not
          # a measurement. The job log needs a token; annotations do not.
          Select-String -Path "$HOME\attack-verify.log" -Pattern 'report:|FAIL:' |
            Select-Object -First 8 |
            ForEach-Object { Write-Host "::warning title=windows-attack::$($_.Line.Trim())" }
          exit $testExit
      - name: netinstall suite
        timeout-minutes: 20
        shell: bash
        env:
          NETINSTALL_CC: zig cc
        run: |
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          bash netinstall/test/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screenshots
          path: |
            C:\Users\runneradmin\*.png
            C:\Users\runneradmin\netinstall-screenshots\
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash build.sh --tier=testing test/neutrinotest.js test/neutrinotest.cmd
      - run: bash test/parse.sh test/neutrinotest.cmd
      - run: |
          echo "=== Launching app ==="
          bash test/neutrinotest.cmd > ~/neutrino-stdout.log 2>&1 &
          APP_PID=$!
          # Steps run under bash -e, so a failing verifier aborts this block
          # where it stands. Written as "cmd; VAR=$?" the app's output below is
          # unreachable on exactly the runs that need it, which is why the last
          # one reported a window and nothing else.
          TEST_EXIT=0
          APP_PID=$APP_PID bash test/verify-macos.sh ~/screenshots || TEST_EXIT=$?
          kill "$APP_PID" 2>/dev/null || true
          echo "=== app output ==="
          cat ~/neutrino-stdout.log || true
          exit $TEST_EXIT
      # The tight tier: webview.cmd confining its own process, whether or not
      # netinstall launched it. Asserted from both sides -- the webview has to
      # survive the profile, and the profile has to refuse something -- because
      # either half alone passes for the wrong reason.
      - run: |
          bash build.sh --tier=testing,tight test/neutrinotest.js test/neutrinotight.cmd
          bash test/verify-macos-tight.sh test/neutrinotight.cmd ~/screenshots
      - run: |
          bash build.sh --tier=testing test/neutrinoattack.js test/neutrinoattack.cmd
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinoattack.cmd > ~/neutrino-attack.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-attack.sh > ~/attack-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoattack 2>/dev/null || true
          cat ~/attack-verify.log
          echo "=== app output ==="
          cat ~/neutrino-attack.log || true
          bash test/annotate.sh macos-attack ~/attack-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      # Recorded here rather than asserted: this driver has no navigation
      # delegate to arm at all, which is PR 6's business. The testing tier is
      # what writes the status file the verifier reads.
      - run: |
          python3 test/stall.py 8099 > ~/stall.log 2>&1 &
          STALL_PID=$!
          # Where the page under test navigates to. It has to answer: with a
          # host that never resolves the navigation fails on its own and every
          # driver reports "held", guard or no guard -- measured on macOS.
          # This does not return until it is serving, so the app below cannot
          # navigate into a port nothing has bound yet.
          PAGES_PID="$(bash test/serve-target.sh ~/pages.log)"
          bash build.sh --tier=testing test/neutrinoearly.js test/neutrinoearly.cmd
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinoearly.cmd > ~/early.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-early.sh > ~/early-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoearly 2>/dev/null || true
          kill "$STALL_PID" 2>/dev/null || true
          kill "$PAGES_PID" 2>/dev/null || true
          cat ~/early-verify.log
          echo "=== app output ==="
          cat ~/early.log || true
          bash test/annotate.sh macos-early ~/early-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      - name: netinstall suite
        timeout-minutes: 20
        run: |
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          bash netinstall/test/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-screenshots
          path: |
            ~/screenshots/
            ~/netinstall-screenshots/
  # netinstall/sandbox_bsd.c describes a confinement that, until this lane, had
  # never been compiled by anything in this repository -- build.sh cross-compiles
  # six targets and none of them is a BSD, and no runner GitHub offers is one
  # either. Four of its rules were wrong, including one that made every shell
  # script it launched fail on `2>/dev/null`. A VM is the only way to ask, so
  # this asks on every push, with the same suite the other four lanes answer to.
  openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Pinned to the commit v1.4.6 points at, on the same terms as everything
      # else this branch pinned: a tag is a name its owner can move.
      - name: netinstall suite
        id: vm
        continue-on-error: true
        uses: vmactions/openbsd-vm@e6c68b637a12e83519688d115d57d5b0b53923cd
        with:
          usesh: true
          copyback: true
          # bash and curl are what the suite runs on; python3 is what serves the
          # payloads and drives the network probes. The image carries the rest --
          # seq, timeout, perl and sha256(1), which lib.sh now knows about
          # because this platform ships neither sha256sum nor shasum.
          prepare: |
            pkg_add -I bash curl || true
            pkg_add -I python3 || pkg_add -I python%3 || true
          # The log comes back rather than going to the job log: reading a job
          # log needs a token and reading annotations does not, which is the
          # same reason annotate.sh exists for the webview lanes.
          run: |
            bash netinstall/test/run.sh > openbsd-suite.log 2>&1
            echo "$?" > openbsd-suite.rc
      - name: results
        if: always()
        run: bash test/annotate.sh openbsd openbsd-suite.log 'FAIL:|failure\(s\)|SKIP'
      - name: outcome
        if: always()
        run: |
          [ "${{ steps.vm.outcome }}" = "success" ] ||
            echo "::error title=openbsd::the vm step itself did not complete"
          exit "$(cat openbsd-suite.rc 2>/dev/null || echo 1)"
  netinstall-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: bash netinstall/build.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: netinstall-binaries
          path: netinstall/dist/
