name: CI
on: [push]

# Every ceiling in this file is derived, and there are two rules, because a step
# timeout and a job timeout answer different questions.
#
# A step's ceiling sits above the internal budget of what it runs, not above the
# time it usually takes. verify-std.sh waits 180s for a first window and records
# for 90 (150 for the window probe); decoflip.sh and themeflip.sh spend that
# twice, with a 30s wait between halves. So the geometry pair's floor is about
# nine and a half minutes even though it takes fifteen seconds, and a ceiling
# under that floor would kill the verifier in the middle of reporting *why* it
# failed -- turning a diagnosable failure into an anonymous one, which is the
# only outcome worse than a slow lane.
#
# Above that floor, tight. `stdwin` had twenty minutes for a step measured at
# 151 seconds against a floor of six, and the cost of that headroom is paid by
# the case it was meant for: `windows-content`'s decoration pair has wedged
# twice, at 1215s and 1815s, each time held to the end of a ceiling far above
# anything it could legitimately need. Fourteen minutes is above its floor and
# less than half of what the last hang cost.
#
# A job's ceiling is not the sum of its steps. It answers "has this lane stopped"
# rather than "is this step slow", so it sits above the lane's measured wall
# clock with room for a slow runner, and every lane here measures between 11 and
# 19 minutes -- except `wayland`, which is a splash suite behind an apt install
# and is expected in single digits. Its ceiling is the one guess in this file,
# and it is a guess because the lane is new; the first complete run replaces it.
#
# Measured on run 33446055662 and 33450686867, not guessed, and the two hangs
# above are from 33363744511 and 33366711441.

jobs:
  # Measured against a complete run rather than guessed: this lane took 12.0 min measured, and a netinstall step that may take 35.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  gjs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Which lane this is. Set on the job rather than on the steps because every
    # suite files rows under it and none of them should have to be told twice.
    # The directory those rows go in cannot be set here -- see the step below.
    env:
      NT_LANE: gjs
    steps:
      - uses: actions/checkout@v7
      # The harness, and the verifiers on top of it, with no display and no app.
      # Five seconds, and it runs before anything that needs a desktop: a broken
      # reporter makes every reading behind it unreadable, so it is worth
      # finding out first.
      #
      # On this lane, macos and windows-launch, which is where assemble.sh runs
      # and for the same reason -- three userlands, and the awk, sed and base64
      # this leans on are not the same programs on them.
      - timeout-minutes: 5
        run: bash test/lib/selftest.sh
      - run: |
          sudo apt update
          sudo apt install -y xvfb gjs imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy xsettingsd \
            gir1.2-webkit2-4.1 \
            || sudo apt install -y xvfb gjs imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy xsettingsd \
            gir1.2-webkit2-4.0
      # Ubuntu refuses unprivileged user namespaces by default, so WebKitGTK's
      # sandbox cannot start and neutrino correctly declines to ask for it.
      # That leaves the sandboxed path unexercised on the only machine that
      # runs this suite, so lift the knob here -- netinstall's own suite does
      # the same thing for the same reason. Nothing shipped may do this; it is
      # root's decision, and a test is the only thing entitled to make it.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Before anything runs, so no step can start the machine's browser. See
      # test/apparatus/nobrowser.sh: `mayOpenExternal` ends at `xdg-open`, and on this
      # image that is Google Chrome, whose terms-of-service window then sits on
      # the display for the rest of the job and in every screenshot after it.
      - run: bash test/apparatus/nobrowser.sh
      # The lane, from test/suites.tsv: every row that names gjs, in the
      # file's order, each under its own ::group:: and its own leash. What each
      # suite is and why it is here is written there, once, above its rows.
      # One step and not seventeen, because a suite that fails must not skip the
      # suites behind it -- run.sh runs every row and counts -- and because the
      # bound on a suite is its row's, not a `timeout-minutes` kept equal to it
      # by hand. A red suite names itself with an ::error carrying this lane's
      # name; the job's ceiling above is the backstop for a hang the leash did
      # not catch.
      - run: bash test/run.sh gjs
      # The lane's page, built and published by .github/actions/sheet, which
      # says what it is and why it cannot redden a lane.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: gjs
          sources: |
            The suites=$HOME/screenshots
            netinstall=$HOME/netinstall-screenshots

  # The rest of the engine walk, on one machine descending it.
  #
  # The launcher used to accept one interpreter by name, and the first half of
  # this lane is the machine that was refused by it: cjs is Cinnamon's fork of
  # gjs, it is what Linux Mint ships, and it needs nothing from the JavaScript
  # -- run() dispatches on imports.gi, which it has. gjs is removed rather than
  # merely not installed, because a runner image that happens to carry it would
  # send this half down the first candidate and report a cjs pass it never
  # measured.
  #
  # The second half is the lane of last resort, and the one that has to be
  # forced: python3 is on every runner, so it measures nothing unless every
  # engine above it is absent. All three are removed, and it refuses to
  # continue if any came back.
  #
  # They used to be two jobs, and two jobs is how the walk stops being a walk:
  # each installed its own toolchain, removed the engines above it, and spent
  # more of its runtime on `apt update` than on anything it measured. Here the
  # removals are the walk -- cjs runs with gjs gone, then cjs goes too and
  # python3 is what is left -- and the second half is gated
  # `if: always()`, so a red cjs still leaves a python3 reading behind it.
  #
  # The two halves write into the same ~/screenshots, so cjs's upload sits
  # between them rather than at the end.
  # Measured against a complete run rather than guessed: this lane took 10.6 min measured.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  linux-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NT_LANE: linux-engines
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt update
          sudo apt remove -y gjs || true
          sudo apt install -y xvfb cjs imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy xsettingsd \
            gir1.2-webkit2-4.1 \
            || sudo apt install -y xvfb cjs imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy xsettingsd \
            gir1.2-webkit2-4.0
      # The lane naming what it is, before anything is measured on it. A lane
      # that silently ran the engine it was meant to be standing in for is the
      # one failure this whole job cannot report on its own.
      - run: |
          command -v gjs >/dev/null 2>&1 &&
            { echo "this lane is meant to have no gjs; it has one" >&2; exit 1; }
          command -v cjs >/dev/null 2>&1 ||
            { echo "cjs did not install; nothing below is a reading" >&2; exit 1; }
          echo "engine: $(command -v cjs)"
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Before anything runs, so no step can start the machine's browser. See
      # test/apparatus/nobrowser.sh: `mayOpenExternal` ends at `xdg-open`, and on this
      # image that is Google Chrome, whose terms-of-service window then sits on
      # the display for the rest of the job and in every screenshot after it.
      - run: bash test/apparatus/nobrowser.sh
      # The cjs half of the lane, from test/suites.tsv, as one step; the gjs
      # lane says why. Its rows write their pictures where the phase's
      # `shots=` in test/lanes.tsv says, which is what lets the pygobject half
      # below write into ~/screenshots without a step between them.
      - run: bash test/run.sh linux-engines:cjs
      - if: always()
        run: |
          sudo apt update
          # One at a time, and this is the merge's own finding. As one command
          # -- `apt remove -y gjs cjs qml6 qt6-declarative-dev-tools` -- apt
          # resolves every name before it removes anything, `qml6` is not a
          # package name in Ubuntu, and the whole transaction aborts with
          # "Unable to locate package qml6" having removed nothing at all. The
          # `|| true` then swallowed the status.
          #
          # On its own runner that was invisible: none of the four were
          # installed there, so a no-op remove and a real one look the same.
          # Behind the cjs half they are not the same, and the guard below is
          # what said so -- cjs was still on the machine and this lane is meant
          # to reach python3. The guard is the only thing in the job that could
          # have caught it, which is why it is there.
          for pkg in gjs cjs qml6 qt6-declarative-dev-tools; do
            sudo apt remove -y "$pkg" || true
          done
          sudo apt install -y xvfb imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy xsettingsd \
            python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-javascriptcoregtk-4.1 \
            || sudo apt install -y xvfb imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy xsettingsd \
            python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.0 gir1.2-javascriptcoregtk-4.0
      - if: always()
        run: |
          for engine in gjs gjs-console cjs cjs-console qml6 qml; do
            command -v "$engine" >/dev/null 2>&1 &&
              { echo "this lane is meant to reach python3; $engine is in the way" >&2; exit 1; }
          done
          # Asked by importing what the lane needs, not by looking for a name:
          # python3 is always here and the bindings are a separate package.
          # 4.1 first and 4.0 second, which is resolveLinuxWebKitVersion's order
          # and has to stay that way.
          probe() { python3 -I -c "import gi; gi.require_version('Gtk','3.0'); gi.require_version('WebKit2','$1'); gi.require_version('JavaScriptCore','$1'); from gi.repository import Gtk, WebKit2, JavaScriptCore; print('engine: python3 with PyGObject, WebKit2 $1')"; }
          probe 4.1 || probe 4.0 || { echo "no WebKit2 or JavaScriptCore typelib" >&2; exit 1; }
      - if: always()
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The python3 half, gated `if: always()` so a red cjs still leaves a
      # python3 reading behind it.
      - if: always()
        run: bash test/run.sh linux-engines:py
      # The lane's page, built and published by .github/actions/sheet, which
      # says what it is and why it cannot redden a lane.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: linux-engines
          sources: |
            cjs=$HOME/shots-cjs
            PyGObject=$HOME/screenshots

  # The Qt lane's live theme half, which needs a desktop this runner cannot be.
  #
  # Its own job and not a step in `kde`, because the two ask different
  # questions of different machines. `kde` is ubuntu-latest, where Qt loads
  # QGtk3Theme and a theme change under a running process delivers nothing --
  # measured, and that is the honest answer for that desktop. Whether the lane
  # follows a change on the desktop it is named for could not be asked there
  # at all: Ubuntu's plasma-integration is built against Qt 5, so there is no
  # Qt 6 KDE platform theme to install.
  #
  # So this job brings one. The image is built and pushed by the `kde image`
  # workflow when its definition changes; a run here pulls it. If the pull
  # fails -- a fork with no package published yet -- test/apparatus/qtkde.sh builds it
  # locally instead, which is slow but not broken.
  # Measured against a complete run rather than guessed: this lane took 2.1 min
  # measured, almost all of it the one step below. Read across five runs, that
  # step is 62s, 73s, 75s, 75s and 121s -- the spread is the image pull, not the
  # half.
  #
  # Until now the block above this one belonged to kde and had drifted down into
  # this job's step list, which is how a lane running test/apparatus/qtkde.sh alone came to
  # be annotated with the ceiling of a netinstall step it does not have. This
  # lane's own numbers were never written down and its one real step had no
  # ceiling at all.
  #
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  kde-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      NT_LANE: kde-live
      # Whose package to pull: a fork pulls its own, and the row's suite
      # lowercases it, because ghcr.io names are and repository owners are not.
      NT_KDE_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      # Best-effort: a public package needs no login, and a fork without one
      # falls through to the local build rather than failing here.
      - run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin || true
      # The lane, from test/suites.tsv, as one step; the gjs lane says why. Its
      # one row is the live theme half on a desktop this runner brings up in a
      # container, and the suite is what tells "passed" from "could not run
      # here" -- which the step used to do by reading the log after the fact.
      - run: bash test/run.sh kde-live
      # Same as bsd: one log, and until now no way to read it but the job page.
      # The lane's page, built and published by .github/actions/sheet, which
      # says what it is and why it cannot redden a lane.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: kde-live

  # Measured against a complete run rather than guessed: this lane took 12.6 min measured, and a netinstall step that may take 35.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  kde:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NT_LANE: kde
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt update
          sudo apt install -y xvfb imagemagick x11-xserver-utils x11-utils mesa-utils libgl1-mesa-dri libegl-mesa0 openbox \
            xdotool xauth dbus \
            qt6-declarative-dev-tools qml6-module-qtwebengine qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qt6-gtk-platformtheme xsettingsd
          if ! command -v qml6 >/dev/null 2>&1 && ! command -v qml >/dev/null 2>&1 && ! command -v qmlscene6 >/dev/null 2>&1 && ! command -v qmlscene-qt6 >/dev/null 2>&1; then
            sudo apt install -y qml6 || sudo apt install -y qml-qt6 || sudo apt install -y qmlscene-qt6 || true
          fi
      # test/apparatus/nobrowser.sh: `mayOpenExternal` ends at `xdg-open`, and on this
      # image that is Google Chrome, whose terms-of-service window then sits on
      # the display for the rest of the job and in every screenshot after it.
      - run: bash test/apparatus/nobrowser.sh
      # The lane, from test/suites.tsv, as one step; the gjs lane says why.
      - run: bash test/run.sh kde
      # The lane's page, built and published by .github/actions/sheet, which
      # says what it is and why it cannot redden a lane.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: kde
          sources: |
            The suites=$HOME/screenshots

  # The wayland splash, which nothing in this file had ever run.
  #
  # netinstall speaks two display protocols and this matrix only ever spoke
  # one. Every Linux lane here is Xvfb, macOS is AppKit and Windows is user32,
  # so `splash_wayland.c` -- the longest of the five platform files, and the
  # only one that has to compose the window's pixels itself, because the
  # protocol has no drawing in it and the compositor takes finished buffers --
  # was compiled on six targets a push and executed on none. Both cases in
  # splash.sh that are about wayland ended in "no compositor on this machine",
  # on every lane, every round.
  #
  # Splash and nothing else, which is the whole of what wayland changes here.
  # The rest of the netinstall suite asks what a kernel refuses, and this lane
  # is ubuntu-latest like gjs and kde: running the rest would be the same
  # measurement on the same machine a third time. NEUTRINO_SUITES is read by
  # run.sh and exists for exactly this.
  #
  # An X server as well as the compositor, and it is not redundancy. Two cases
  # in that suite are about the choice *between* the two -- that a stale
  # WAYLAND_DISPLAY falls back to X11 rather than leaving an X session with no
  # window, and that a reachable compositor is preferred when DISPLAY is also
  # set, because a session running XWayland sets both and taking the X path
  # there would draw through a compatibility layer to reach the compositor the
  # other path talks to directly. Neither can be asserted on a machine with one
  # server. This is the only lane with both, so it is the only lane where
  # either of them is more than a skip.
  #
  # Unmeasured, unlike every other ceiling in this file: the first complete run
  # is what replaces it. The work is an apt install, one compositor, the three
  # builds run.sh always does and a suite that takes fifteen seconds elsewhere.
  wayland:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NT_LANE: wayland
    steps:
      - uses: actions/checkout@v7
      # sway rather than weston, which is also in the archive and is the
      # reference implementation. See test/apparatus/wayland-up.sh: the deciding
      # difference is that this lane has to come away with a picture, and grim
      # takes one through wlr-screencopy without ceremony.
      #
      # wayland-utils is `wayland-info`, and it is not optional here even
      # though the helper treats it as such. It is the only thing in this lane
      # that connects to the compositor as a wayland client before the suite
      # does, so it is what tells a compositor that is up but advertising no
      # xdg_wm_base apart from a splash that failed to draw on a good one.
      - run: |
          sudo apt update
          sudo apt install -y sway grim xvfb wayland-utils \
            || sudo apt install -y sway grim xvfb wayland-utils
      # The lane, from test/suites.tsv, as one step; the gjs lane says why.
      # Its lane row says `display=wayland`, which is an X server and a
      # compositor -- test/lib/display.sh says why both and
      # test/apparatus/wayland-up.sh says why sway -- and a compositor that
      # does not come up fails the row before the splash can decline silently
      # on a machine with none.
      - run: bash test/run.sh wayland
      # The lane's page, built and published by .github/actions/sheet, which
      # says what it is and why it cannot redden a lane.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: wayland
          sources: |
            netinstall=$HOME/netinstall-screenshots

  # netinstall away from the desktop lanes: cross-compiled for six targets, and

  # then run on the three BSDs, in that order on one runner.
  #
  # Four jobs before this, and every one of them was mostly waiting -- the
  # cross build is 45 seconds of zig behind a minute of action setup, and each
  # VM lane spent its runner booting a guest to run a shell suite. Serialised
  # they are one job of about fifteen minutes, which is the same band the
  # macOS and Windows jobs land in.
  #
  # `mem: 3072` on each guest is not cosmetic: the default is 6144, the post
  # step that halts a vmactions VM does not run until the job ends, so all
  # three are alive at once, and three times the default does not fit on this
  # runner. The suites here are shell, curl and a small C compile; 3G is ample.
  #
  # The freebsd and netbsd lanes both used to copy back `bsd-suite.log` and
  # `bsd-probe.log`. In one job those are the same file, so each guest now
  # names its own. Every step is gated `if: always()` -- the whole point of
  # three separate lanes was that a dead guest cost only its own reading, and
  # that has to survive the merge.
  bsd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NT_LANE: bsd
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: bash netinstall/build.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: netinstall-binaries
          path: netinstall/dist/
      # The guests do not need this and cannot hold it.
      #
      # setup-zig points ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR at
      # `<workspace>/.zig-cache`, netinstall/build.sh fills `.zig-cache/o` with
      # thousands of sibling directories, and every vmactions step rsyncs the
      # whole workspace into its guest before running anything. On a BSD guest
      # that hits the filesystem's per-directory link limit and rsync gives up:
      # 7822 `mkdir ... failed: Too many links (31)` in one run, then exit 23.
      #
      # rsync exiting non-zero is what made the step "not complete", and the
      # `.rc` files the outcome steps read are written inside the guest and
      # copied back -- so they never arrived, `probe rc=absent`, and the lane
      # went red having measured nothing. The suites themselves were fine; on
      # the same run freebsd reported `Total: 0 failure(s)` from the half that
      # got through.
      #
      # Moved rather than deleted, and put back by the last step in the job, so
      # setup-zig's own post step still has a cache to save.
      #
      # Parked in $HOME and not in $RUNNER_TEMP, which would have looked right
      # and done nothing: RUNNER_TEMP is `/home/runner/work/_temp` and the
      # rsync source is `/home/runner/work/`, so the cache would have been
      # copied in from there instead. $HOME is the nearest directory that is
      # outside the tree the guests are sent.
      - if: always()
        name: move the zig cache out of the guests' way
        run: |
          if [ -d .zig-cache ]; then
            rm -rf "$HOME/zig-cache-parked"
            mv .zig-cache "$HOME/zig-cache-parked"
            echo "report: .zig-cache parked outside the workspace for the vm steps"
          else
            echo "report: no .zig-cache to move"
          fi
      # Pinned to the commit v1.4.6 points at, on the same terms as everything
      # else this branch pinned: a tag is a name its owner can move.
      - if: always()
        name: netinstall suite
        id: openbsd_vm
        continue-on-error: true
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530
        with:
          usesh: true
          mem: "3072"
          copyback: true
          # bash and curl are what the suite runs on; python3 is what serves the
          # payloads and drives the network probes. The image carries the rest --
          # seq, timeout, perl and sha256(1), which lib.sh now knows about
          # because this platform ships neither sha256sum nor shasum.
          #
          # wget is here for fetchbound.sh alone. It is the branch whose two
          # bounds come from the kernel rather than from the downloader, and
          # without it installed this lane skips every assertion about them --
          # on the one platform in the matrix with a different libc and a
          # different kernel, which is exactly where setrlimit and sigaction
          # are worth asking twice.
          prepare: |
            pkg_add -I bash curl wget || true
            pkg_add -I python3 || pkg_add -I python%3 || true
          # The log comes back rather than being written inside the guest and
          # left there. It is copied out and printed by a step of its own, which
          # is why the `suite log` steps below are the one place in this file
          # that still exist only to `cat` something.
          #
          # `&& rc=0 || rc=$?` and not a bare `$?`: vmactions pipes this script
          # to `sh` behind a literal `set -eu` (index.js, `const fullCmd`), and
          # run.sh exits with its failure count -- so the first red suite would
          # abort the script before the rc file is written, and the action skips
          # copyback entirely when the ssh command returns non-zero. This lane
          # has only ever been green, which is the only reason it has not
          # already lost a log to it. The `exit 0` is what keeps the ssh command
          # successful; the outcome step below is what fails the lane.
          run: |
            # NT_LANE inside the guest, because the job-level env is the host's
            # and vmactions does not carry it across the ssh. Without it every
            # row this suite writes is filed under `local`, which is the honest
            # default for a workstation and wrong for a lane.
            #
            # The rows go into the workspace rather than a temporary, so that
            # `copyback: true` brings them out the way it brings out the log.
            # There is no $RUNNER_TEMP in here and nothing else would survive
            # the guest being torn down.
            export NT_LANE=bsd
            export NT_RESULTS_DIR="$PWD/nt-results"
            mkdir -p "$NT_RESULTS_DIR"
            bash netinstall/test/run.sh > openbsd-suite.log 2>&1 && rc=0 || rc=$?
            echo "$rc" > openbsd-suite.rc
            exit 0
      # One step, one cat, per guest.
      #
      # These were four steps apiece, each running annotate.sh over the same
      # suite log with a different grep -- results, readings, errors, totals --
      # because annotations were the only channel that reached a reader without
      # a token, and each bucket had its own cap to spend. `gh` reads the job
      # log directly now, so the four greps collapse into the thing they were
      # all approximating: the log itself, printed once.
      #
      # This is the one lane where that log has no other route out. It is
      # written inside a guest VM and copied back, so nothing else in the job
      # prints it -- which is why these steps become `cat` rather than
      # disappearing with the rest.
      - name: suite log
        if: always()
        run: cat openbsd-suite.log
      # The step the comment on the guest run has promised since that run was
      # written, and which was never actually here.
      #
      # `run.sh` exits its failure count inside the guest, and the guest step
      # swallows that on purpose: vmactions runs the script behind `set -eu` and
      # skips copyback when the ssh command returns non-zero, so a red suite
      # that failed honestly would take its own log down with it. The status is
      # written to a file instead and carried out with the log -- and until now
      # nothing read the file. With `continue-on-error` on the guest step as
      # well, an OpenBSD suite could fail every assertion it has and the lane
      # stayed green.
      #
      # An absent rc file is a failure and not a pass. It means the guest never
      # reached the end of the run, or copyback did not happen, and neither is a
      # state this lane may report as success -- that was the whole defect.
      - name: outcome
        if: always()
        run: |
          if [ ! -f openbsd-suite.rc ]; then
            echo "FAIL: no rc came back from the guest; the suite's result is unknown"
            exit 1
          fi
          rc="$(cat openbsd-suite.rc)"
          echo "report: openbsd suite rc=$rc"
          [ "$rc" = "0" ] || { echo "FAIL: the openbsd suite reported $rc failure(s)"; exit 1; }
      # Three steps over the suite log, because the cap is per step and round 2
      # dropped four chunks from the middle of the failures alone. Anchored to
      # the plain `  FAIL:` echo, not to /FAIL:/ -- nt_fail prints the same
      # sentence twice, once for a reader and once as an ::error, and matching
      # both halved the number of distinct failures that fit.
      # Most of what this lane counts as failures are suites exiting 2 without
      # printing a FAIL line at all -- a setup that did not come up, not an
      # assertion that did not hold. Those two are different problems and the
      # results step above cannot see the first one.

      # This lane published nothing. Its whole reading is a log written inside a
      # guest and copied back, so a reader who wanted it had to open the job.
      # One artifact, like every other lane.
      #
      # The tenth caller of .github/actions/sheet, and the last lane that was
      # still spelling the page and its upload by hand. What kept it out was
      # `--gather`, which reads $HOME: every other lane's verifiers write their
      # logs and pictures there, and this one's are written inside a guest and
      # arrive in the workspace because `copyback: true` copies the workspace
      # and nothing else. That is not a reason to keep a second spelling of the
      # sheet -- it is a lane whose evidence has a different address, which is
      # what `sources` is for. Three copies into a staging directory become the
      # two places the evidence actually is, named.
      #
      # `gather:` is emptied rather than left at its default. Nothing on this
      # job writes a log or a picture to $HOME -- the only thing parked there is
      # the zig cache, which is neither -- so gathering would find nothing; and
      # saying so here is the difference between a lane that has no $HOME
      # evidence and a lane that was expected to have some and lost it.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: bsd
          gather: ""
          sources: |
            Logs=openbsd-suite.log
            Logs=nt-results
      # Last, and unconditional: setup-zig's post step saves whatever is at
      # ZIG_GLOBAL_CACHE_DIR, and that path is still the workspace one.
      - if: always()
        name: put the zig cache back
        run: |
          if [ -d "$HOME/zig-cache-parked" ]; then
            rm -rf .zig-cache
            mv "$HOME/zig-cache-parked" .zig-cache
            echo "report: .zig-cache restored for the cache save"
          fi

  # How the exe gets onto disk and comes up: the core launch, the driver's own

  # file and process I/O, the app cache, the gap between the compile and the
  # START, an initialisation that fails, the netinstall suite, and the same
  # launch watched on a runner that is busy.
  #
  # Five jobs before this and part of a sixth, four of them under two minutes
  # and each paying a runner's setup for it. They are one lane now, in cost
  # order, with every group after the first gated `if: always()` -- which is
  # the property the split was bought for, and the reason this is not simply
  # the old monolith back: a red suite here costs its own reading and nothing
  # behind it.
  #
  # The load probe goes last on purpose. It starts cpus*3 spinners, and
  # nothing else in the lane should be measured against them.
  # Measured against a complete run rather than guessed: this lane took 16.9 min measured, the longest lane, netinstall step 20.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  windows-launch:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NT_LANE: windows-launch
    steps:
      - uses: actions/checkout@v7
      # MSYS's turn at the harness. See the gjs lane for why this runs on three.
      - timeout-minutes: 5
        shell: bash
        run: bash test/lib/selftest.sh
      # The compiler netinstall's suite builds with, put on the machine before
      # the lane runs: provisioning is the workflow's, and the row that needs
      # it says so in its essay.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      # The lane, from test/suites.tsv, as one step; the gjs lane says why, and
      # the manifest's "pwsh rows" section says how a PowerShell suite is one.
      # NETINSTALL_CC is the machine's, not a row's: it is what setup-zig put
      # here, and a row is not the place to say what a machine has.
      - shell: bash
        env:
          NETINSTALL_CC: zig cc
        run: bash test/run.sh windows-launch
      # The lane's page, built and published by .github/actions/sheet, which
      # says what it is and why it cannot redden a lane.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: windows-launch
          gather: The suites
          sources: |
            netinstall=$HOME/netinstall-screenshots
            Under load, replica 1=$HOME/load-shots-1
            Under load, replica 2=$HOME/load-shots-2

  # What the page is allowed to do, and what the driver does with a document
  # that is not the one it was handed: hostile page content, the navigation
  # surface, the offline tier, and the swap between `boot`'s read of the
  # document and the driver's.
  #
  # The offline suite and docswap were already sharing a job for this reason;
  # the attack and navigation suites join them because they ask the same
  # question of the same driver. Every group is gated `if: always()`, so a red
  # offline tier does not hide whether docswap passed -- the failure that cost
  # a whole round when all of this sat in one long lane.
  # Measured against a complete run rather than guessed: this lane took 14.8 min measured.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  windows-content:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NT_LANE: windows-content
    steps:
      - uses: actions/checkout@v7
      # The suites this lane is made of, parsed before any of them runs, for
      # the same reason the compile below happens first -- see psparse.ps1.
      # The lane, from test/suites.tsv, as one step; the gjs lane says why, and
      # the manifest's "pwsh rows" section says how a PowerShell suite is one.
      - shell: bash
        run: bash test/run.sh windows-content
      # The lane's page, built and published by .github/actions/sheet, which
      # says what it is and why it cannot redden a lane.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: windows-content
          gather: The suites
          sources: |
            docswap=$HOME/docswaplogs
            nav=$HOME/navlogs

  # Everything this platform has to say about a running app: the core launch

  # the loader environment, hostile content, a page that navigates before its
  # own load finished, and the navigation guard's account of itself.
  #
  # Four macOS jobs before this, and three of them came to five minutes
  # between them. Everything after the core launch is gated `if: always()`.
  #
  # One upload at the end: all four jobs pointed at ~/screenshots, so the
  # separate artifacts were separate names over the same directory.
  # Measured against a complete run rather than guessed: this lane took 11.4 min measured.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NT_LANE: macos
    steps:
      - uses: actions/checkout@v7
      # The BSD userland's turn at the harness. See the gjs lane for why this
      # runs on three.
      - timeout-minutes: 5
        run: bash test/lib/selftest.sh
      # The lane, from test/suites.tsv, as one step; the gjs lane says why.
      - run: bash test/run.sh macos
      # The lane's page, built and published by .github/actions/sheet, which
      # says what it is and why it cannot redden a lane.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: macos
          sources: |
            The suites=$HOME/screenshots

  # The netinstall suite, alone. It is the longest single reading in the whole
  # matrix -- one run.sh that nothing here can split -- so it is what every
  # other job is balanced against, and it carries nothing else that a runner
  # would have to wait behind.
  # Measured against a complete run rather than guessed: this lane took 14.3 min measured, almost all of it one step.
  # That figure is from before the suite stopped running neutrino's verifiers,
  # which is a minute of it on this lane; the ceilings below are above the old
  # number and therefore above the new one, and the next complete run is what
  # gets to replace it.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  #
  # The shotroom step is back, for the splash's pictures. The suite stopped
  # photographing the webview -- what it asks of a launch is whether a webview
  # started and ran its script, which is a title and not a photograph -- and the
  # step left with the pictures. splash.sh now takes a portrait of the splash
  # window and six frames of it moving, and without the room cleared first every
  # one of them carries the screen recording alert over the window it is a
  # picture of, which is exactly what the lane's captures looked like before the
  # step existed.
  macos-netinstall:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      NT_LANE: macos-netinstall
    steps:
      - uses: actions/checkout@v7
      # The lane, from test/suites.tsv, as one step: the room cleared of its
      # alert, then the installer's whole suite. The gjs lane says why one
      # step, and the manifest says what each row is.
      - run: bash test/run.sh macos-netinstall
      # The lane's page, built and published by .github/actions/sheet, which
      # says what it is and why it cannot redden a lane.
      - name: sheet
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sheet
        with:
          lane: macos-netinstall
          sources: |
            netinstall=$HOME/netinstall-screenshots

  # Every case, on every lane, in one grid.
  #
  # Until this job existed the redundancy question was answerable only by hand:
  # download the run's artifacts and run sheetdiff.py over them, which the
  # README documents and which therefore happened when somebody remembered. And
  # it could only ever approximate the answer, because an assertion's identity
  # was its sentence -- folded at every run of digits, and requiring two
  # languages to write the same words. The rows carry a case id now, so the grid
  # is exact and it costs a job that runs in under a minute.
  #
  # `if: always()` and `needs:` every lane that publishes a sheet: the run this
  # grid is most worth reading is the one where a lane went red, and a summary
  # gated on success is a summary that is absent exactly then. A lane that
  # failed simply contributes no sheet and shows as `-`.
  #
  # It never fails the run. Every verdict in it has already been counted by the
  # lane that produced it, and a reporting job that can redden a run is one that
  # eventually reddens it for a reason that is about the report.
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [gjs, linux-engines, kde-live, kde, wayland, bsd, windows-launch,
            windows-content, macos, macos-netinstall]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-sheet"
          path: sheets
      - name: the grid
        run: |
          shopt -s nullglob
          set -- sheets/*/*.html
          if [ "$#" -eq 0 ]; then
            echo "no lane published a sheet; nothing to compare"
            echo "No sheets were published by this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The step summary renders on the run page and has no cap, which is
          # the whole reason it is used here and nowhere else in this file: the
          # grid is the one output of this suite that is about the run rather
          # than about a lane, so it wants the one surface that is not per-job.
          {
            echo "## Cases by lane"
            echo
            python3 test/report/matrix.py --markdown "$@"
          } >> "$GITHUB_STEP_SUMMARY"
          # --strict, so this job has exactly one thing it can go red on.
          #
          # It had none. The grid is the only place all ten lanes are visible at
          # once, and it was reporting to a step that returned 0 whatever it
          # found -- so the two structural defects only it can see were things a
          # person had to notice by diffing two runs, and both of them got
          # through that way: four lanes publishing sheets with no cases at all,
          # and a walk record read as rows putting `500x400` in the grid.
          #
          # Not the failures. A lane that fails a case is already red on its own
          # job, and saying so twice would make this step a second opinion about
          # something that is not its business. What is its business is a lane
          # that went quiet and an id nobody declared -- neither of which any
          # single lane can see about itself.
          #
          # Redirected rather than piped: `| tee` would exit with tee's status
          # and this would go back to being a step that cannot fail, which is
          # the whole defect. Same reason test/lib/step.sh does it that way.
          MRC=0
          python3 test/report/matrix.py --strict "$@" > matrix.txt 2>&1 || MRC=$?
          cat matrix.txt
          exit $MRC
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matrix
          path: matrix.txt
