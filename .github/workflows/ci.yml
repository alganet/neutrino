name: CI
on: [push]
jobs:
  gjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update
          sudo apt install -y xvfb gjs imagemagick x11-xserver-utils gir1.2-webkit2-4.1 \
            || sudo apt install -y xvfb gjs imagemagick x11-xserver-utils gir1.2-webkit2-4.0
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 5
          xsetroot -solid "#112233" &
          bash webview.cmd &
          sleep 10
          import -window root ~/gjs-screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: gjs-screenshot
          path: ~/gjs-screenshot.png
  kde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update
          sudo apt install -y xvfb imagemagick x11-xserver-utils x11-utils mesa-utils libgl1-mesa-dri libegl-mesa0 qt6-declarative-dev-tools qml6-module-qtwebengine qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
          if ! command -v qml6 >/dev/null 2>&1 && ! command -v qml >/dev/null 2>&1 && ! command -v qmlscene6 >/dev/null 2>&1 && ! command -v qmlscene-qt6 >/dev/null 2>&1; then
            sudo apt install -y qml6 || sudo apt install -y qml-qt6 || sudo apt install -y qmlscene-qt6 || true
          fi
      - run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          sleep 5

          xsetroot -solid "#112233" &

          dbus-run-session -- bash webview.cmd &
          APP_PID=$!

          sleep 15

          import -window root ~/kde-screenshot.png

          kill "$APP_PID" >/dev/null 2>&1 || true
          kill "$XVFB_PID" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: kde-screenshot
          path: ~/kde-screenshot.png
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          .\webview.cmd
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $p = Get-Process windows-app -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p -and $p.MainWindowHandle -ne 0) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bounds.Size)
          $bitmap.Save("$env:USERPROFILE\windows-screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()
          $graphics.Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshot
          path: C:\Users\runneradmin\windows-screenshot.png   
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash webview.cmd &
          sleep 8
          screencapture -x ~/macos-screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: macos-screenshot
          path: ~/macos-screenshot.png
