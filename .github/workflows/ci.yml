name: CI
on: [push]
jobs:
  gjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt update
          sudo apt install -y xvfb gjs imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy \
            gir1.2-webkit2-4.1 \
            || sudo apt install -y xvfb gjs imagemagick x11-xserver-utils metacity \
            xdotool x11-utils xauth dbus bubblewrap xdg-dbus-proxy \
            gir1.2-webkit2-4.0
      # Ubuntu refuses unprivileged user namespaces by default, so WebKitGTK's
      # sandbox cannot start and neutrino correctly declines to ask for it.
      # That leaves the sandboxed path unexercised on the only machine that
      # runs this suite, so lift the knob here -- netinstall's own suite does
      # the same thing for the same reason. Nothing shipped may do this; it is
      # root's decision, and a test is the only thing entitled to make it.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: bash build.sh test/neutrinotest.js test/neutrinotest.cmd
      - run: bash test/parse.sh test/neutrinotest.cmd
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3
          metacity &
          sleep 2
          xsetroot -solid "#112233"
          bash test/neutrinotest.cmd &
          APP_PID=$!
          bash test/verify-linux.sh ~/screenshots
          TEST_EXIT=$?
          kill "$APP_PID" 2>/dev/null || true
          exit $TEST_EXIT
      # The app under test here is hostile page content. Built at the default
      # tier on purpose: this lane is what says the shipped configuration
      # refuses these, not a configuration assembled for the test.
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; metacity >/dev/null 2>&1 & sleep 2; }
          bash build.sh test/neutrinoattack.js test/neutrinoattack.cmd
          bash test/neutrinoattack.cmd > ~/attack.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-attack.sh > ~/attack-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoattack 2>/dev/null || true
          cat ~/attack-verify.log
          bash test/annotate.sh gjs-attack ~/attack-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      # PR 5 probing. Measurements, not assertions. Every step below reports
      # through annotations and then exits 0 on purpose: a job log needs a
      # token the machine reading these results does not have, so an exit code
      # with nothing attached to it costs a whole round trip and measures
      # nothing.
      - name: probe - what the gjs view answers, and when the page script runs
        run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; metacity >/dev/null 2>&1 & sleep 2; }
          bash build.sh --tier=testing test/neutrinoprobe.js test/neutrinoprobe.cmd
          bash test/neutrinoprobe.cmd > ~/probe.log 2>&1 &
          sleep 30
          wid=$(xdotool search --name "^PROBE " 2>/dev/null | head -1) || true
          if [ -n "$wid" ]; then
            xdotool getwindowname "$wid" >> ~/probe.log
          else
            echo "no PROBE window: nothing rendered, so an empty trace means nothing" >> ~/probe.log
          fi
          pkill -f neutrinoprobe 2>/dev/null || true
          bash test/annotate.sh gjs-probe ~/probe.log 'probe5|PROBE |no PROBE'
          exit 0
      - name: probe - a navigation from the top of the page script (gjs)
        run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; metacity >/dev/null 2>&1 & sleep 2; }
          bash build.sh --tier=testing test/neutrinoprobe-early.js test/neutrinoprobe-early.cmd
          bash test/neutrinoprobe-early.cmd > ~/probe-early.log 2>&1 &
          sleep 30
          wid=$(xdotool search --name "^PROBE-EARLY" 2>/dev/null | head -1) || true
          if [ -n "$wid" ]; then
            xdotool getwindowname "$wid" >> ~/probe-early.log
          else
            echo "no PROBE-EARLY window: the document did not survive its own navigation" >> ~/probe-early.log
          fi
          pkill -f neutrinoprobe-early 2>/dev/null || true
          bash test/annotate.sh gjs-probe-early ~/probe-early.log 'probe5|PROBE-EARLY|no PROBE-EARLY'
          exit 0
      # The candidate change tried, rather than reasoned about. Arming the
      # guard at COMMITTED puts it live during the app's own initial load, and
      # if isOwnDocument does not recognise the uri the engine gives that load
      # the app locks itself out of its own document. That failure is a blank
      # window and not an error, so the real test app and its verifier are what
      # can tell it apart from a pass.
      - name: probe - arm the gjs guard at COMMITTED and run the real test app
        run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; metacity >/dev/null 2>&1 & sleep 2; }
          cp webview.cmd /tmp/webview.cmd.orig
          n=$(grep -c 'WebKit2\.LoadEvent\.FINISHED' webview.cmd || true)
          echo "probe5 trial: comparisons to rewrite=$n (want 1)" >> ~/committed.log
          sed -i 's/WebKit2\.LoadEvent\.FINISHED/WebKit2.LoadEvent.COMMITTED/' webview.cmd
          bash build.sh --tier=testing test/neutrinotest.js test/neutrinocommitted.cmd
          cp /tmp/webview.cmd.orig webview.cmd
          bash test/neutrinocommitted.cmd >> ~/committed.log 2>&1 &
          APP_PID=$!
          bash test/verify-linux.sh ~/committed-shots > ~/committed-verify.log 2>&1 || true
          kill "$APP_PID" 2>/dev/null || true
          pkill -f neutrinocommitted 2>/dev/null || true
          grep -aE 'PASS|FAIL|TIMEOUT|Results' ~/committed-verify.log | sed 's/^/probe5 trial /' >> ~/committed.log || true
          bash test/annotate.sh gjs-committed-trial ~/committed.log 'probe5'
          exit 0
      - name: netinstall suite
        timeout-minutes: 35
        run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; metacity >/dev/null 2>&1 & sleep 2; }
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          bash netinstall/test/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gjs-screenshots
          path: |
            ~/screenshots/
            ~/netinstall-screenshots/
  kde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt update
          sudo apt install -y xvfb imagemagick x11-xserver-utils x11-utils mesa-utils libgl1-mesa-dri libegl-mesa0 openbox \
            xdotool xauth dbus \
            qt6-declarative-dev-tools qml6-module-qtwebengine qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
          if ! command -v qml6 >/dev/null 2>&1 && ! command -v qml >/dev/null 2>&1 && ! command -v qmlscene6 >/dev/null 2>&1 && ! command -v qmlscene-qt6 >/dev/null 2>&1; then
            sudo apt install -y qml6 || sudo apt install -y qml-qt6 || sudo apt install -y qmlscene-qt6 || true
          fi
      - run: bash build.sh --tier=testing test/neutrinotest.js test/neutrinotest.cmd
      - run: bash test/parse.sh test/neutrinotest.cmd
      - run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3
          openbox &
          sleep 2
          xsetroot -solid "#112233"
          dbus-run-session -- bash test/neutrinotest.cmd &
          APP_PID=$!
          bash test/verify-linux.sh ~/screenshots
          TEST_EXIT=$?
          kill "$APP_PID" 2>/dev/null || true
          exit $TEST_EXIT
      # The app under test here is hostile page content. Built at the default
      # tier on purpose: this lane is what says the shipped configuration
      # refuses these, not a configuration assembled for the test.
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          bash build.sh test/neutrinoattack.js test/neutrinoattack.cmd
          bash test/neutrinoattack.cmd > ~/attack.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-attack.sh > ~/attack-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoattack 2>/dev/null || true
          cat ~/attack-verify.log
          bash test/annotate.sh kde-attack ~/attack-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      # PR 5 probing on the Qt driver. Same terms as the gjs lane: annotations,
      # then exit 0, because the results have to be readable without a token.
      - name: probe - what the Qt view answers, and when the page script runs
        run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          bash build.sh --tier=testing test/neutrinoprobe.js test/neutrinoprobe.cmd
          bash test/neutrinoprobe.cmd > ~/probe.log 2>&1 &
          sleep 40
          wid=$(xdotool search --name "^PROBE " 2>/dev/null | head -1) || true
          if [ -n "$wid" ]; then
            xdotool getwindowname "$wid" >> ~/probe.log
          else
            echo "no PROBE window: nothing rendered, so an empty trace means nothing" >> ~/probe.log
          fi
          pkill -f neutrinoprobe 2>/dev/null || true
          bash test/annotate.sh kde-probe ~/probe.log 'probe5|PROBE |no PROBE'
          exit 0
      - name: probe - a navigation from the top of the page script (Qt)
        run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          bash build.sh --tier=testing test/neutrinoprobe-early.js test/neutrinoprobe-early.cmd
          bash test/neutrinoprobe-early.cmd > ~/probe-early.log 2>&1 &
          sleep 40
          wid=$(xdotool search --name "^PROBE-EARLY" 2>/dev/null | head -1) || true
          if [ -n "$wid" ]; then
            xdotool getwindowname "$wid" >> ~/probe-early.log
          else
            echo "no PROBE-EARLY window: the document did not survive its own navigation" >> ~/probe-early.log
          fi
          pkill -f neutrinoprobe-early 2>/dev/null || true
          bash test/annotate.sh kde-probe-early ~/probe-early.log 'probe5|PROBE-EARLY|no PROBE-EARLY'
          exit 0
      - name: netinstall suite
        timeout-minutes: 35
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export QTWEBENGINE_DISABLE_SANDBOX=1
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          dbus-run-session -- bash netinstall/test/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kde-screenshots
          path: |
            ~/screenshots/
            ~/netinstall-screenshots/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: bash build.sh test/neutrinotest.js test/neutrinotest.cmd
      - shell: bash
        run: bash test/parse.sh test/neutrinotest.cmd
      # The netinstall step below has had a timeout all along and this one has
      # not, so anything that fails to exit here stops the whole run rather
      # than the step. The app not exiting is exactly what a missing close
      # handler produced.
      - timeout-minutes: 15
        shell: pwsh
        run: |
          .\test\neutrinotest.cmd
          & .\test\verify-windows.ps1
          $testExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -ne "" } | Where-Object { $_.MainWindowTitle -like "*neutrino*" -or $_.MainWindowTitle -like "*STEP*" -or $_.MainWindowTitle -like "*TESTS DONE*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $testExit
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - shell: bash
        run: bash build.sh test/neutrinoattack.js test/neutrinoattack.cmd
      - timeout-minutes: 15
        shell: pwsh
        run: |
          .\test\neutrinoattack.cmd
          & .\test\verify-attack.ps1 *>&1 | Tee-Object -FilePath "$HOME\attack-verify.log"
          $testExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "ATTACK *" } | Stop-Process -Force -ErrorAction SilentlyContinue
          # PR 5 probing. This lane changes nothing, but it reports the new
          # postnav field like every other, and a field nobody can read is not
          # a measurement. The job log needs a token; annotations do not.
          Select-String -Path "$HOME\attack-verify.log" -Pattern 'report:|FAIL:' |
            Select-Object -First 8 |
            ForEach-Object { Write-Host "::warning title=windows-attack::$($_.Line.Trim())" }
          exit $testExit
      - name: netinstall suite
        timeout-minutes: 20
        shell: bash
        env:
          NETINSTALL_CC: zig cc
        run: |
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          bash netinstall/test/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screenshots
          path: |
            C:\Users\runneradmin\*.png
            C:\Users\runneradmin\netinstall-screenshots\
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash build.sh --tier=testing test/neutrinotest.js test/neutrinotest.cmd
      - run: bash test/parse.sh test/neutrinotest.cmd
      - run: |
          echo "=== Launching app ==="
          bash test/neutrinotest.cmd > ~/neutrino-stdout.log 2>&1 &
          APP_PID=$!
          # Steps run under bash -e, so a failing verifier aborts this block
          # where it stands. Written as "cmd; VAR=$?" the app's output below is
          # unreachable on exactly the runs that need it, which is why the last
          # one reported a window and nothing else.
          TEST_EXIT=0
          APP_PID=$APP_PID bash test/verify-macos.sh ~/screenshots || TEST_EXIT=$?
          kill "$APP_PID" 2>/dev/null || true
          echo "=== app output ==="
          cat ~/neutrino-stdout.log || true
          exit $TEST_EXIT
      # The tight tier: webview.cmd confining its own process, whether or not
      # netinstall launched it. Asserted from both sides -- the webview has to
      # survive the profile, and the profile has to refuse something -- because
      # either half alone passes for the wrong reason.
      - run: |
          bash build.sh --tier=testing,tight test/neutrinotest.js test/neutrinotight.cmd
          bash test/verify-macos-tight.sh test/neutrinotight.cmd ~/screenshots
      - run: |
          bash build.sh --tier=testing test/neutrinoattack.js test/neutrinoattack.cmd
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinoattack.cmd > ~/neutrino-attack.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-attack.sh > ~/attack-verify.log 2>&1 || TEST_EXIT=$?
          pkill -f neutrinoattack 2>/dev/null || true
          cat ~/attack-verify.log
          echo "=== app output ==="
          cat ~/neutrino-attack.log || true
          bash test/annotate.sh macos-attack ~/attack-verify.log 'report:|FAIL:'
          exit $TEST_EXIT
      # PR 5 probing. This driver is the only one that already checks who sent
      # a message, and the check PR 5 proposes for all three is a generalised
      # half of it -- so what this view answers is the reference the other two
      # are being compared against.
      - name: probe - what the macOS view answers at message time
        run: |
          bash build.sh --tier=testing test/neutrinoprobe.js test/neutrinoprobe.cmd
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinoprobe.cmd > ~/probe.log 2>&1 &
          sleep 30
          pkill -f neutrinoprobe 2>/dev/null || true
          if [ -f "${TMPDIR:-/tmp}/neutrino-title.txt" ]; then
            sed -n '1p' "${TMPDIR:-/tmp}/neutrino-title.txt" >> ~/probe.log
          else
            echo "no PROBE title: nothing rendered, so an empty trace means nothing" >> ~/probe.log
          fi
          bash test/annotate.sh macos-probe ~/probe.log 'probe5|PROBE |no PROBE'
          exit 0
      - name: netinstall suite
        timeout-minutes: 20
        run: |
          export NEUTRINO_SCREENSHOTS="$HOME/netinstall-screenshots"
          bash netinstall/test/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-screenshots
          path: |
            ~/screenshots/
            ~/netinstall-screenshots/
  netinstall-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: bash netinstall/build.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: netinstall-binaries
          path: netinstall/dist/
