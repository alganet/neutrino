      # The single-launch theme step above says what an engine reports and
      # nothing about provenance, and that gap is not hypothetical. WebKit
      # hardcodes Highlight one unit from Adwaita's accent, so on a default
      # GNOME desktop it reads exactly like an engine following the palette --
      # round 2 recorded it as doing so, and it does not. Flipped to
      # Adwaita:dark the desktop's accent moved and Highlight did not.
      #
      # So this launches twice with the desktop flipped between and asks one
      # question of each value: did it move. themeflip.sh owns the sequencing
      # because two parts of it are easy to get wrong and invisible in YAML --
      # the knob is cleared before it is set, each half, and the second half
      # refuses to start while the first half's window is still up, since both
      # answer to the same title prefix and a stale reading does not announce
      # itself.
      #
      # The differential's middle control is what fails a lane whose knob does
      # not work: better a red step that says the flip did not take than a
      # green one reporting fifteen constants it never disturbed. Last in the
      # lane and gated, so that costs its own reading and nothing else.
      - if: always()
        timeout-minutes: 14
        run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; metacity >/dev/null 2>&1 & sleep 2; }
          bash test/mkapp.sh --testing test/neutrinostdtheme.js test/neutrinostdtheme.cmd
          bash test/parse.sh test/neutrinostdtheme.cmd
          TEST_EXIT=0
          bash test/themeflip.sh gtk test/neutrinostdtheme.cmd ~/screenshots \
            > ~/themediff.log 2>&1 || TEST_EXIT=$?
          # Both halves' own logs, beside the differential that read them.
          cat ~/flip-a.log ~/flip-b.log ~/themediff.log 2>/dev/null || true
          exit $TEST_EXIT
      # One artifact, one file: the lane's pictures and logs as a page that opens
      # in a browser. What it replaces is a directory of PNGs in a zip, which
      # made comparing the decorated frame against the chromeless one a matter
      # of extracting both and remembering the first while looking at the
      # second. The pictures are inlined, so there is nothing to fetch and
      # nothing to run.
      #
      # continue-on-error, because this is a reporting tool. A lane that passed
      # every control it has and goes red because the page builder tripped is
      # reporting about itself, and the thing it was built to report on is the
      # one nobody would then read.
      - name: sheet
        if: always()
        continue-on-error: true
        run: |
          # The verifier logs, gathered. They sit loose in the home directory --
          # ~/stdgeom.log, ~/themediff.log, ~/deco-a.log and a dozen more -- so
          # every sheet this lane has published carried "logs=0" while the
          # Windows ones carried sixteen. A sheet that cannot show what the lane
          # asserted cannot be read for what the lane asserted twice.
          mkdir -p ~/sheetsrc
          cp ~/*.log ~/sheetsrc/ 2>/dev/null || true
          bash test/sheet.sh linux-engines ~/sheet/linux-engines.html \
            "cjs=$HOME/shots-cjs" \
            "PyGObject=$HOME/screenshots" \
            "Logs=$HOME/sheetsrc"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-engines-sheet
          path: ~/sheet/linux-engines.html

  # The Qt lane's live theme half, which needs a desktop this runner cannot be.
  #
  # Its own job and not a step in `kde`, because the two ask different
  # questions of different machines. `kde` is ubuntu-latest, where Qt loads
  # QGtk3Theme and a theme change under a running process delivers nothing --
  # measured, and that is the honest answer for that desktop. Whether the lane
  # follows a change on the desktop it is named for could not be asked there
  # at all: Ubuntu's plasma-integration is built against Qt 5, so there is no
  # Qt 6 KDE platform theme to install.
  #
  # So this job brings one. The image is built and pushed by the `kde image`
  # workflow when its definition changes; a run here pulls it. If the pull
  # fails -- a fork with no package published yet -- test/qtkde.sh builds it
  # locally instead, which is slow but not broken.
  kde-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      # Best-effort: a public package needs no login, and a fork without one
      # falls through to the local build rather than failing here.
      - run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin || true
      # A half that could not run says so and does not fail the job -- that is
      # the same contract the other live halves keep, and the reason it is
      # checked here rather than left to an exit status: qtkde.sh exits 0 both
      # when the half passed and when there was no desktop to run it on, and
      # those are not the same result to a reader.
      - shell: bash
        run: |
          NT_KDE_RUNTIME=docker \
          NT_KDE_IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/neutrino-kde:f42" \
            bash test/qtkde.sh 2>&1 | tee ~/qtkde.log
          # FAIL first, and that order is the whole point: a run that reached
          # the flip and was handed nothing also prints the note saying which
          # plugin it found, so a skip check asked first would read a real
          # failure as a machine that could not run the half.
          if grep -q '^FAIL' ~/qtkde.log; then
            exit 1
          fi
          if grep -q '^PASS' ~/qtkde.log; then
            exit 0
          fi
          if grep -qE '^report: (live half: (no|a scheme|the control)|qtkde: (no|the image|pull))' ~/qtkde.log; then
            echo "kde-live: the half did not run here; the notes above say why"
            exit 0
          fi
          echo "kde-live: no PASS, no FAIL and no reason given"
          exit 1

  # Measured against a complete run rather than guessed: this lane took 12.6 min measured, and a netinstall step that may take 35.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  kde:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt update
          sudo apt install -y xvfb imagemagick x11-xserver-utils x11-utils mesa-utils libgl1-mesa-dri libegl-mesa0 openbox \
            xdotool xauth dbus \
            qt6-declarative-dev-tools qml6-module-qtwebengine qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qt6-gtk-platformtheme xsettingsd
          if ! command -v qml6 >/dev/null 2>&1 && ! command -v qml >/dev/null 2>&1 && ! command -v qmlscene6 >/dev/null 2>&1 && ! command -v qmlscene-qt6 >/dev/null 2>&1; then
            sudo apt install -y qml6 || sudo apt install -y qml-qt6 || sudo apt install -y qmlscene-qt6 || true
          fi
      # test/nobrowser.sh: `mayOpenExternal` ends at `xdg-open`, and on this
      # image that is Google Chrome, whose terms-of-service window then sits on
      # the display for the rest of the job and in every screenshot after it.
      - run: bash test/nobrowser.sh
      - run: bash test/mkapp.sh --testing test/neutrinotest.js test/neutrinotest.cmd
      - run: bash test/parse.sh test/neutrinotest.cmd
      # The engine walk, asserted with stub interpreters: no display, no
      # toolkit, and it is the only place the meaning of an exit status is
      # checked rather than assumed.
      - timeout-minutes: 5
        run: |
          TEST_EXIT=0
          bash test/lanes.sh test/neutrinotest.cmd > ~/lanes.log 2>&1 || TEST_EXIT=$?
          cat ~/lanes.log
          exit $TEST_EXIT
      # No assemble.sh on this lane, and that follows from its own rule rather
      # than against it. It runs wherever the assembler is assembled because
      # "the spelling of what it asserts is sed's and the three seds here are
      # not the same program" -- three: GNU, BSD and MSYS. This lane and gjs are
      # both ubuntu-latest and share the one GNU sed, so the second run asks the
      # same program the same question. It is 9 s, which is the smallest thing
      # in this branch and the easiest to put back; what it buys is that the
      # rule now means what it says.
      #
      # gjs, windows-launch and macos still run it, which is one lane per sed.
      # The Qt launch path's document, which no longer has a name. Every check
      # is one that fails against the commit before it, and the payloads it
      # plants are proven live against qml itself first. It runs first in this
      # lane for the round that measures it and goes back behind the other
      # suites afterwards.
      #
      # QTWEBENGINE_CHROMIUM_FLAGS and QML_XHR_ALLOW_FILE_READ are for the
      # sections that drive qml directly and so do not get what run_qt sets for
      # its own launch. Neither reaches an app launch: the scrub takes both
      # before any engine starts.
      - timeout-minutes: 25
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_DISABLE_SANDBOX=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-dev-shm-usage"
          export QML_XHR_ALLOW_FILE_READ=1
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          bash test/mkapp.sh --testing test/neutrinoloaders.js test/neutrinoappdir.cmd
          TEST_EXIT=0
          bash test/appdir.sh test/neutrinoappdir.cmd > ~/appdir.log 2>&1 || TEST_EXIT=$?
          cat ~/appdir.log
          exit $TEST_EXIT
      # The loader environment the standalone launch path hands its engine.
      # Every check here is against the same build with the fix cut out of it,
      # so "it would have failed before" is measured in this run rather than
      # claimed. Two builds go in: the testing tier, because the suite has to
      # know the app came up and on two lanes that is scaffolding -- the macOS
      # driver writes its title to a file only there, and Qt's Chromium needs
      # the no-sandbox flag this container cannot do without -- and the default
      # tier, which is the only build the sandbox section can ask its question
      # of, since the testing tier is what puts --no-sandbox on the command
      # line. Neither tier touches the environment.
      - timeout-minutes: 25
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_DISABLE_SANDBOX=1
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          bash test/mkapp.sh --testing test/neutrinoloaders.js test/neutrinoloaders.cmd
          bash test/mkapp.sh test/neutrinoloaders.js test/neutrinoloaders-default.cmd
          TEST_EXIT=0
          bash test/loaders.sh test/neutrinoloaders.cmd test/neutrinoloaders-default.cmd > ~/loaders.log 2>&1 || TEST_EXIT=$?
          cat ~/loaders.log
          exit $TEST_EXIT
      - run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3
          openbox &
          sleep 2
          xsetroot -solid "#112233"
          dbus-run-session -- bash test/neutrinotest.cmd &
          APP_PID=$!
          bash test/verify-linux.sh ~/screenshots
          TEST_EXIT=$?
          kill "$APP_PID" 2>/dev/null || true
          exit $TEST_EXIT
      # The app under test here is hostile page content. Built at the default
      # tier on purpose: this lane is what says the shipped configuration
      # refuses these, not a configuration assembled for the test.
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          bash test/mkapp.sh test/neutrinoattack.js test/neutrinoattack.cmd
          bash test/neutrinoattack.cmd > ~/attack.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-attack.sh > ~/attack-verify.log 2>&1 || TEST_EXIT=$?
          bash test/reap.sh neutrinoattack ATTACK
          cat ~/attack-verify.log
          exit $TEST_EXIT
      # A page that navigates before its own load has finished. Built at the
      # default tier for the same reason the attack app is: this lane is what
      # says the shipped configuration holds, not a configuration assembled for
      # the test. stall.py is what keeps the document's load pending, which is
      # what puts the guard under test instead of a race -- the verifier
      # asserts the document really was still loading, so a listener that did
      # not come up is a failure and not a quiet pass.
      - run: |
          export DISPLAY=:99
          export GDK_BACKEND=x11
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          python3 test/stall.py 8099 > ~/stall.log 2>&1 &
          STALL_PID=$!
          # Where the page under test navigates to. It has to answer: with a
          # host that never resolves the navigation fails on its own and every
          # driver reports "held", guard or no guard -- measured on macOS.
          # This does not return until it is serving, so the app below cannot
          # navigate into a port nothing has bound yet.
          PAGES_PID="$(bash test/serve-target.sh ~/pages.log)"
          bash test/mkapp.sh test/neutrinoearly.js test/neutrinoearly.cmd
          bash test/neutrinoearly.cmd > ~/early.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-early.sh > ~/early-verify.log 2>&1 || TEST_EXIT=$?
          bash test/reap.sh neutrinoearly EARLY
          kill "$STALL_PID" 2>/dev/null || true
          kill "$PAGES_PID" 2>/dev/null || true
          cat ~/early-verify.log
          exit $TEST_EXIT
      - name: netinstall suite
        timeout-minutes: 25
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export QTWEBENGINE_DISABLE_SANDBOX=1
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          # The toolkit-facing four, and not the whole list. This lane and gjs
          # are both ubuntu-latest -- one kernel, one Landlock ABI -- so every
          # suite above that asks what the kernel refuses was being asked twice
          # on the same machine, about 170 s a push. See run.sh, where the
          # variable is read and the argument is written out in full.
          #
          # These four are the ones where the two lanes differ: env carries Qt's
          # loader knobs here and GTK's there, and the other three put a real
          # webview under a tier -- which is the whole reason a second Linux lane
          # exists. confine-session doubly so: dbus-run-session below means the
          # session it closes was really there, and nt_userns lifts AppArmor
          # from inside the suite here where gjs has a job step do it.
          export NEUTRINO_SUITES="env e2e"
          dbus-run-session -- bash netinstall/test/run.sh
      # The web-standards probe, round 1: the apparatus, and nothing else.
      #
      # Two questions were opened here. Whether an app can be written against
      # `window.resizeTo` and `window.outerWidth` instead of against
      # `neutrino.window.resize` and nothing at all; and whether an assignment
      # to `document.title` reaches the native title. Both are answered now --
      # the standard spellings are written over the engine's, and the launcher
      # connects each engine's title-changed signal to the window -- and
      # neither was answered by this round. What this round is for is the instruments: verify-std.sh records
      # a window's title and geometry in one loop with nothing slow in it, and
      # until that loop is known to read a live window and to see it change,
      # every pair of numbers it prints later is unattributable.
      #
      # So both apps mutate the window through the API that already works, and
      # the verifier fails its own control when it cannot see the mutation. A
      # run where the harness reads the same geometry either side of a resize
      # has not measured the engine's `outerWidth`; it has measured a window
      # that never moved, or an instrument pointed at the wrong one.
      #
      # Last in the lane and `if: always()`, which is both halves of one rule.
      # A probe must not fail a lane -- these verifiers exit non-zero only when
      # a control fails, never for a reading. And a lane must not fail a probe,
      # which is what the gate buys: a suite ahead of this going red for
      # unrelated reasons once skipped the probe behind it and cost a whole
      # round for a step that could not have made the lane worse.
      #
      # The two probes are separate steps and separate apps. The geometry app
      # is written never to close, so if the first step fails to reap it its
      # window is still up when the second begins -- which is why they search
      # for `^STD-GEOM-` and `^STD-DOC-` and not for a shared prefix.
      - if: always()
        timeout-minutes: 14
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          bash test/mkapp.sh --testing test/neutrinostdgeom.js test/neutrinostdgeom.cmd
          bash test/mkapp.sh --testing --decorations=none test/neutrinostdgeom.js test/neutrinostdgeom-none.cmd
          bash test/parse.sh test/neutrinostdgeom.cmd
          bash test/parse.sh test/neutrinostdgeom-none.cmd
          TEST_EXIT=0
          # Both halves and the differential, in place of the single launch
          # this step used to make. The decorated half is that launch: it runs
          # first, it is the control, and its verifier exit is carried into
          # this step's exit the way it always was.
          bash test/decoflip.sh test/neutrinostdgeom.cmd test/neutrinostdgeom-none.cmd ~/screenshots > ~/stdgeom.log 2>&1 || TEST_EXIT=$?
          cat ~/deco-a.log ~/deco-b.log ~/stdgeom.log
          exit $TEST_EXIT
      - if: always()
        timeout-minutes: 8
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          bash test/mkapp.sh --testing test/neutrinostddoc.js test/neutrinostddoc.cmd
          bash test/parse.sh test/neutrinostddoc.cmd
          bash test/neutrinostddoc.cmd > ~/stddoc-app.log 2>&1 &
          APP_PID=$!
          TEST_EXIT=0
          bash test/verify-std.sh doc ~/screenshots > ~/stddoc.log 2>&1 || TEST_EXIT=$?
          pkill -P "$APP_PID" 2>/dev/null || true
          kill "$APP_PID" 2>/dev/null || true
          cat ~/stddoc.log
          exit $TEST_EXIT
      # Round 2. Whether the standard window verbs do anything and can be
      # taken over if they do not, and whether `neutrino.theme` is redundant
      # with CSS. Round 1 is what earns these their place: it said the
      # recording loop keeps up on every lane, that the size arithmetic agrees
      # with the one engine that reports its own outer size, and -- on macOS --
      # that the file this platform reads titles through was being written
      # wrong. Stacking these on an unvalidated instrument would have made one
      # red cost four readings instead of one.
      #
      # The window probe's own control is the phase order: the launcher's API
      # is exercised *after* the four native calls, because "resizeTo did
      # nothing" and "the window stopped responding" are the same reading
      # otherwise. The theme probe's is a colour keyword no engine can resolve,
      # so that "unsupported" is distinguishable from a value -- and this round
      # deliberately does not flip the desktop palette, so it reports what each
      # engine says and settles nothing about where the value came from.
      - if: always()
        timeout-minutes: 10
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          bash test/mkapp.sh --testing test/neutrinostdwin.js test/neutrinostdwin.cmd
          bash test/parse.sh test/neutrinostdwin.cmd
          bash test/neutrinostdwin.cmd > ~/stdwin-app.log 2>&1 &
          APP_PID=$!
          TEST_EXIT=0
          bash test/verify-std.sh win ~/screenshots > ~/stdwin.log 2>&1 || TEST_EXIT=$?
          pkill -P "$APP_PID" 2>/dev/null || true
          kill "$APP_PID" 2>/dev/null || true
          cat ~/stdwin.log
          exit $TEST_EXIT
      - if: always()
        timeout-minutes: 8
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          bash test/mkapp.sh --testing test/neutrinostdtheme.js test/neutrinostdtheme.cmd
          bash test/parse.sh test/neutrinostdtheme.cmd
          bash test/neutrinostdtheme.cmd > ~/stdtheme-app.log 2>&1 &
          APP_PID=$!
          TEST_EXIT=0
          bash test/verify-std.sh theme ~/screenshots > ~/stdtheme.log 2>&1 || TEST_EXIT=$?
          pkill -P "$APP_PID" 2>/dev/null || true
          kill "$APP_PID" 2>/dev/null || true
          cat ~/stdtheme.log
          exit $TEST_EXIT
      # Round 3: where each colour came from.
      #
      # The single-launch theme step above says what an engine reports and
      # nothing about provenance, and that gap is not hypothetical. WebKit
      # hardcodes Highlight one unit from Adwaita's accent, so on a default
      # GNOME desktop it reads exactly like an engine following the palette --
      # round 2 recorded it as doing so, and it does not. Flipped to
      # Adwaita:dark the desktop's accent moved and Highlight did not.
      #
      # So this launches twice with the desktop flipped between and asks one
      # question of each value: did it move. themeflip.sh owns the sequencing
      # because two parts of it are easy to get wrong and invisible in YAML --
      # the knob is cleared before it is set, each half, and the second half
      # refuses to start while the first half's window is still up, since both
      # answer to the same title prefix and a stale reading does not announce
      # itself.
      #
      # The differential's middle control is what fails a lane whose knob does
      # not work: better a red step that says the flip did not take than a
      # green one reporting fifteen constants it never disturbed. Last in the
      # lane and gated, so that costs its own reading and nothing else.
      - if: always()
        timeout-minutes: 14
        run: |
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-dev-shm-usage"
          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; openbox >/dev/null 2>&1 & sleep 2; }
          bash test/mkapp.sh --testing test/neutrinostdtheme.js test/neutrinostdtheme.cmd
          bash test/parse.sh test/neutrinostdtheme.cmd
          TEST_EXIT=0
          bash test/themeflip.sh qt test/neutrinostdtheme.cmd ~/screenshots \
            > ~/themediff.log 2>&1 || TEST_EXIT=$?
          # Both halves' own logs, beside the differential that read them.
          cat ~/flip-a.log ~/flip-b.log ~/themediff.log 2>/dev/null || true
          exit $TEST_EXIT
      # One artifact, one file: the lane's pictures and logs as a page that opens
      # in a browser. What it replaces is a directory of PNGs in a zip, which
      # made comparing the decorated frame against the chromeless one a matter
      # of extracting both and remembering the first while looking at the
      # second. The pictures are inlined, so there is nothing to fetch and
      # nothing to run.
      #
      # continue-on-error, because this is a reporting tool. A lane that passed
      # every control it has and goes red because the page builder tripped is
      # reporting about itself, and the thing it was built to report on is the
      # one nobody would then read.
      - name: sheet
        if: always()
        continue-on-error: true
        run: |
          # The verifier logs, gathered. They sit loose in the home directory --
          # ~/stdgeom.log, ~/themediff.log, ~/deco-a.log and a dozen more -- so
          # every sheet this lane has published carried "logs=0" while the
          # Windows ones carried sixteen. A sheet that cannot show what the lane
          # asserted cannot be read for what the lane asserted twice.
          mkdir -p ~/sheetsrc
          cp ~/*.log ~/sheetsrc/ 2>/dev/null || true
          bash test/sheet.sh kde ~/sheet/kde.html \
            "The suites=$HOME/screenshots" \
            "Logs=$HOME/sheetsrc"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kde-sheet
          path: ~/sheet/kde.html

  # The wayland splash, which nothing in this file had ever run.
  #
  # netinstall speaks two display protocols and this matrix only ever spoke
  # one. Every Linux lane here is Xvfb, macOS is AppKit and Windows is user32,
  # so `splash_wayland.c` -- the longest of the five platform files, and the
  # only one that has to compose the window's pixels itself, because the
  # protocol has no drawing in it and the compositor takes finished buffers --
  # was compiled on six targets a push and executed on none. Both cases in
  # splash.sh that are about wayland ended in "no compositor on this machine",
  # on every lane, every round.
  #
  # Splash and nothing else, which is the whole of what wayland changes here.
  # The rest of the netinstall suite asks what a kernel refuses, and this lane
  # is ubuntu-latest like gjs and kde: running the rest would be the same
  # measurement on the same machine a third time. NEUTRINO_SUITES is read by
  # run.sh and exists for exactly this.
  #
  # An X server as well as the compositor, and it is not redundancy. Two cases
  # in that suite are about the choice *between* the two -- that a stale
  # WAYLAND_DISPLAY falls back to X11 rather than leaving an X session with no
  # window, and that a reachable compositor is preferred when DISPLAY is also
  # set, because a session running XWayland sets both and taking the X path
  # there would draw through a compatibility layer to reach the compositor the
  # other path talks to directly. Neither can be asserted on a machine with one
  # server. This is the only lane with both, so it is the only lane where
  # either of them is more than a skip.
  #
  # Unmeasured, unlike every other ceiling in this file: the first complete run
  # is what replaces it. The work is an apt install, one compositor, the three
  # builds run.sh always does and a suite that takes fifteen seconds elsewhere.
  wayland:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # sway rather than weston, which is also in the archive and is the
      # reference implementation. See test/wayland-up.sh: the deciding
      # difference is that this lane has to come away with a picture, and grim
      # takes one through wlr-screencopy without ceremony.
      #
      # wayland-utils is `wayland-info`, and it is not optional here even
      # though the helper treats it as such. It is the only thing in this lane
      # that connects to the compositor as a wayland client before the suite
      # does, so it is what tells a compositor that is up but advertising no
      # xdg_wm_base apart from a splash that failed to draw on a good one.
      - run: |
          sudo apt update
          sudo apt install -y sway grim xvfb wayland-utils \
            || sudo apt install -y sway grim xvfb wayland-utils
      - name: netinstall splash suite
        timeout-minutes: 10
        run: |
          export DISPLAY=:99
          pgrep Xvfb >/dev/null 2>&1 || { Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 3; }
          # Not piped into tee. These steps run under `bash -e` with no
          # pipefail, so a compositor that failed to start would hand its exit
          # status to tee, the lane would carry on, the splash would decline
          # silently on a machine with no compositor, and the run would be
          # green having measured nothing -- which is the exact failure this
          # lane exists to notice.
          WL_RC=0
          bash test/wayland-up.sh ~/wayland.env 1024x768 > ~/wayland-up.log 2>&1 || WL_RC=$?
          cat ~/wayland-up.log
          [ "$WL_RC" = 0 ] || exit "$WL_RC"
          . ~/wayland.env
          echo "report: wayland lane has WAYLAND_DISPLAY=$WAYLAND_DISPLAY and DISPLAY=$DISPLAY"
          export NEUTRINO_SUITES=splash
          export NEUTRINO_SPLASH_SHOTS=$HOME/netinstall-screenshots
          # The reason this lane exists, said out loud, and the one line that
          # keeps it honest. See the gjs lane.
          export NEUTRINO_SPLASH_EXPECT=wayland
          # Redirected so the sheet below has a log to show, then echoed by a
          # process that exits -- which is also what puts the ::error from a
          # failed assertion back in front of the runner.
          NT_EXIT=0
          bash netinstall/test/run.sh > ~/netinstall-splash.log 2>&1 || NT_EXIT=$?
          cat ~/netinstall-splash.log
          exit $NT_EXIT
      # continue-on-error, because this is a reporting tool. A lane that passed
      # every control it has and goes red because the page builder tripped is
      # reporting about itself, and the thing it was built to report on is the
      # one nobody would then read.
      - name: sheet
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ~/sheetsrc
          cp ~/*.log ~/sheetsrc/ 2>/dev/null || true
          bash test/sheet.sh wayland ~/sheet/wayland.html \
            "netinstall=$HOME/netinstall-screenshots" \
            "Logs=$HOME/sheetsrc"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wayland-sheet
          path: ~/sheet/wayland.html

  # netinstall away from the desktop lanes: cross-compiled for six targets, and

  # then run on the three BSDs, in that order on one runner.
  #
  # Four jobs before this, and every one of them was mostly waiting -- the
  # cross build is 45 seconds of zig behind a minute of action setup, and each
  # VM lane spent its runner booting a guest to run a shell suite. Serialised
  # they are one job of about fifteen minutes, which is the same band the
  # macOS and Windows jobs land in.
  #
  # `mem: 3072` on each guest is not cosmetic: the default is 6144, the post
  # step that halts a vmactions VM does not run until the job ends, so all
  # three are alive at once, and three times the default does not fit on this
  # runner. The suites here are shell, curl and a small C compile; 3G is ample.
  #
  # The freebsd and netbsd lanes both used to copy back `bsd-suite.log` and
  # `bsd-probe.log`. In one job those are the same file, so each guest now
  # names its own. Every step is gated `if: always()` -- the whole point of
  # three separate lanes was that a dead guest cost only its own reading, and
  # that has to survive the merge.
  bsd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: bash netinstall/build.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: netinstall-binaries
          path: netinstall/dist/
      # The guests do not need this and cannot hold it.
      #
      # setup-zig points ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR at
      # `<workspace>/.zig-cache`, netinstall/build.sh fills `.zig-cache/o` with
      # thousands of sibling directories, and every vmactions step rsyncs the
      # whole workspace into its guest before running anything. On a BSD guest
      # that hits the filesystem's per-directory link limit and rsync gives up:
      # 7822 `mkdir ... failed: Too many links (31)` in one run, then exit 23.
      #
      # rsync exiting non-zero is what made the step "not complete", and the
      # `.rc` files the outcome steps read are written inside the guest and
      # copied back -- so they never arrived, `probe rc=absent`, and the lane
      # went red having measured nothing. The suites themselves were fine; on
      # the same run freebsd reported `Total: 0 failure(s)` from the half that
      # got through.
      #
      # Moved rather than deleted, and put back by the last step in the job, so
      # setup-zig's own post step still has a cache to save.
      #
      # Parked in $HOME and not in $RUNNER_TEMP, which would have looked right
      # and done nothing: RUNNER_TEMP is `/home/runner/work/_temp` and the
      # rsync source is `/home/runner/work/`, so the cache would have been
      # copied in from there instead. $HOME is the nearest directory that is
      # outside the tree the guests are sent.
      - if: always()
        name: move the zig cache out of the guests' way
        run: |
          if [ -d .zig-cache ]; then
            rm -rf "$HOME/zig-cache-parked"
            mv .zig-cache "$HOME/zig-cache-parked"
            echo "report: .zig-cache parked outside the workspace for the vm steps"
          else
            echo "report: no .zig-cache to move"
          fi
      # Pinned to the commit v1.4.6 points at, on the same terms as everything
      # else this branch pinned: a tag is a name its owner can move.
      - if: always()
        name: netinstall suite
        id: openbsd_vm
        continue-on-error: true
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530
        with:
          usesh: true
          mem: "3072"
          copyback: true
          # bash and curl are what the suite runs on; python3 is what serves the
          # payloads and drives the network probes. The image carries the rest --
          # seq, timeout, perl and sha256(1), which lib.sh now knows about
          # because this platform ships neither sha256sum nor shasum.
          #
          # wget is here for fetchbound.sh alone. It is the branch whose two
          # bounds come from the kernel rather than from the downloader, and
          # without it installed this lane skips every assertion about them --
          # on the one platform in the matrix with a different libc and a
          # different kernel, which is exactly where setrlimit and sigaction
          # are worth asking twice.
          prepare: |
            pkg_add -I bash curl wget || true
            pkg_add -I python3 || pkg_add -I python%3 || true
          # The log comes back rather than being written inside the guest and
          # left there. It is copied out and printed by a step of its own, which
          # is why the `suite log` steps below are the one place in this file
          # that still exist only to `cat` something.
          #
          # `&& rc=0 || rc=$?` and not a bare `$?`: vmactions pipes this script
          # to `sh` behind a literal `set -eu` (index.js, `const fullCmd`), and
          # run.sh exits with its failure count -- so the first red suite would
          # abort the script before the rc file is written, and the action skips
          # copyback entirely when the ssh command returns non-zero. This lane
          # has only ever been green, which is the only reason it has not
          # already lost a log to it. The `exit 0` is what keeps the ssh command
          # successful; the outcome step below is what fails the lane.
          run: |
            bash netinstall/test/run.sh > openbsd-suite.log 2>&1 && rc=0 || rc=$?
            echo "$rc" > openbsd-suite.rc
            exit 0
      # One step, one cat, per guest.
      #
      # These were four steps apiece, each running annotate.sh over the same
      # suite log with a different grep -- results, readings, errors, totals --
      # because annotations were the only channel that reached a reader without
      # a token, and each bucket had its own cap to spend. `gh` reads the job
      # log directly now, so the four greps collapse into the thing they were
      # all approximating: the log itself, printed once.
      #
      # This is the one lane where that log has no other route out. It is
      # written inside a guest VM and copied back, so nothing else in the job
      # prints it -- which is why these steps become `cat` rather than
      # disappearing with the rest.
      - name: suite log
        if: always()
        run: cat openbsd-suite.log
      # Three steps over the suite log, because the cap is per step and round 2
      # dropped four chunks from the middle of the failures alone. Anchored to
      # the plain `  FAIL:` echo, not to /FAIL:/ -- nt_fail prints the same
      # sentence twice, once for a reader and once as an ::error, and matching
      # both halved the number of distinct failures that fit.
      # Most of what this lane counts as failures are suites exiting 2 without
      # printing a FAIL line at all -- a setup that did not come up, not an
      # assertion that did not hold. Those two are different problems and the
      # results step above cannot see the first one.

      # Last, and unconditional: setup-zig's post step saves whatever is at
      # ZIG_GLOBAL_CACHE_DIR, and that path is still the workspace one.
      - if: always()
        name: put the zig cache back
        run: |
          if [ -d "$HOME/zig-cache-parked" ]; then
            rm -rf .zig-cache
            mv "$HOME/zig-cache-parked" .zig-cache
            echo "report: .zig-cache restored for the cache save"
          fi

  # How the exe gets onto disk and comes up: the core launch, the driver's own

  # file and process I/O, the app cache, the gap between the compile and the
  # START, an initialisation that fails, the netinstall suite, and the same
  # launch watched on a runner that is busy.
  #
  # Five jobs before this and part of a sixth, four of them under two minutes
  # and each paying a runner's setup for it. They are one lane now, in cost
  # order, with every group after the first gated `if: always()` -- which is
  # the property the split was bought for, and the reason this is not simply
  # the old monolith back: a red suite here costs its own reading and nothing
  # behind it.
  #
  # The load probe goes last on purpose. It starts cpus*3 spinners, and
  # nothing else in the lane should be measured against them.
  # Measured against a complete run rather than guessed: this lane took 16.9 min measured, the longest lane, netinstall step 20.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  windows-launch:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: bash test/mkapp.sh test/neutrinotest.js test/neutrinotest.cmd
      - shell: bash
        run: bash test/parse.sh test/neutrinotest.cmd
      # And the suites themselves, which are a sixth language nothing checked.
      # The argument below is the one that applies: a file that does not parse
      # is a suite that never runs, found by running it. `$run:` is a scope and
      # not a variable followed by a colon, launchtime.ps1 shipped one, and the
      # lane spent eighteen minutes and skipped `core launch` to say so.
      - timeout-minutes: 5
        shell: pwsh
        run: |
          & .\test\psparse.ps1 *>&1 | Tee-Object -FilePath "$HOME\psparse.log"
          exit $LASTEXITCODE
      # Before anything is launched, because an artifact that does not compile
      # is an app that never appears -- and every suite that waits for a window
      # then waits out its own timeout before saying so. One reserved word in
      # the jsc region cost this lane its runner that way: three suites spent
      # fifty minutes between them against a forty-minute job, the run was
      # killed in the middle of the fourth, and GitHub keeps no logs for a job
      # killed like that. The compiler had said exactly what was wrong, once, on
      # the first launch of the first suite.
      #
      # A second or so, and it compiles the artifact the way the launcher does
      # -- with the reference list read out of the artifact's own jsc line.
      - timeout-minutes: 5
        shell: pwsh
        run: |
          & .\test\compile.ps1 test\neutrinotest.cmd *>&1 | Tee-Object -FilePath "$HOME\compile.log"
          exit $LASTEXITCODE
      # The assembler, and the stamp it says it applied. Pure shell, no display
      # and about a second, so it runs beside parse.sh on every lane that
      # assembles anything -- once per sed, because the spelling of what it
      # asserts is sed's and the three seds here are not the same program. gjs
      # is the GNU one, windows-launch is MSYS, macos is BSD. kde is
      # ubuntu-latest as well and used to run it a fourth time against the very
      # same GNU sed, which is the rule being read as "every lane" rather than
      # as what it says. Every defect is measured against `oldbuild.sh`, the
      # assembler as it shipped through PR 23, carried inside the suite.
      #
      # Bounded, because the first version of it was not: it launched the
      # artifact and waited on it, this lane went from twelve minutes to fifty
      # and lost its runner, and a lane that dies publishes nothing -- so which
      # step blocked was not readable afterwards. The suite no longer starts
      # anything whose exit it does not control, and this is the second half of
      # that.
      - timeout-minutes: 5
        shell: bash
        run: |
          TEST_EXIT=0
          bash test/assemble.sh > ~/assemble.log 2>&1 || TEST_EXIT=$?
          cat ~/assemble.log
          exit $TEST_EXIT
      # The Windows driver's own file and process I/O. Beside assemble.sh for
      # the same reason: it reads a built artifact and compiles small programs,
      # needs no display of its own, and what it asserts is a spelling plus two
      # platform facts -- how CreateProcess resolves a bare program name, and
      # what this framework does to a junction. It launches no app and no
      # window, so nothing it starts can outlive the step.
      #
      # Pointed at the artifact built two steps above rather than at a file in
      # the repository. The launcher is neutrino/ now and there is no single
      # file to read; the artifact is also the better target, since what ships
      # is what these assertions are about.
      #
      # Windows only, because the mechanisms are.
      - timeout-minutes: 10
        shell: pwsh
        run: |
          & .\test\winexec.ps1 test\neutrinotest.cmd *>&1 | Tee-Object -FilePath "$HOME\winexec.log"
          exit $LASTEXITCODE
      # Whether the 20 MB the Windows lane downloads on first run has to be
      # downloaded at all. What renders is the Evergreen Runtime, which is
      # already on this runner and on most machines; the package is the SDK
      # wrapper around it, and the only part of it the runtime does not carry.
      #
      # Beside winexec.ps1 because it is the same kind of step: it reads the
      # built artifact, compiles small programs with the same jsc.exe, starts no
      # window, and nothing it starts outlives the step. It fetches the pinned
      # package once, to read the IIDs out of its header rather than to load
      # anything from it -- so a run of this proves nothing about the network
      # the shipped app would need, which is the point.
      #
      # It can fail the lane, and only on its last section: an environment that
      # will not come up is the hypothesis being wrong, and that is the reading
      # this branch exists to take. Everything above it is measurement.
      - timeout-minutes: 15
        shell: pwsh
        run: |
          & .\test\evergreen.ps1 test\neutrinotest.cmd *>&1 | Tee-Object -FilePath "$HOME\evergreen.log"
          exit $LASTEXITCODE
      # The monolith launched a webview (appcache) before the neutrinotest
      # verify, so the WebView2 runtime's one-time cold init was already done.
      # The verify below is first in this lane, so it is the cold launch, and
      # the documented Windows first-window stall lands on it far more often --
      # measured here, netinstall 3/3 and core 1/2 against a historical 3/10.
      # This restores the precondition: launch a LOADERS webview -- the one
      # appcache shows comes up reliably cold -- wait for its window, and move
      # on. Everything behind it in the lane inherits the warm runtime, which
      # is the state each of those suites was measured in when it had a runner
      # to itself and appcache to warm it.
      - shell: bash
        run: bash test/mkapp.sh --testing test/neutrinoloaders.js test/neutrinowarm.cmd
      - name: warm the WebView2 runtime
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Best-effort: if the warm-up itself stalls it still triggered the
          # runtime init, and the real verify keeps its own 240s bound, so this
          # never fails the job. No pipe on the launcher -- the batch STARTs a
          # detached exe and exits, and a pipe would outlive it (PR 20/28).
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", ".\test\neutrinowarm.cmd" -PassThru -WindowStyle Hidden
          $i = 0
          for (; $i -lt 180; $i++) {
            if (Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like "LOADERS*" }) { break }
            Start-Sleep -Seconds 1
          }
          $state = if ($i -lt 180) { 'UP' } else { 'DOWN' }
          Write-Output "warm: window=$state after ${i}s"
          # Annotate only the miss: a warm-up that came up is the quiet case and
          # a warning every green run is noise. A DOWN means the runtime did not
          # warm and the real verify is about to run cold -- worth surfacing.
          if ($state -eq 'DOWN') { Write-Output "::warning title=warm::warm-up window never came up in ${i}s" }
          # And what the launch spent, phase by phase, which this step is the
          # only place on the lane that can say.
          #
          # It is a --testing build, so the trace channel exists -- the core
          # launch below is a release build where trace is an empty function --
          # and it is the one app here that runs with nothing else loading the
          # machine, so the numbers are the launch's own rather than the
          # runner's. Reported and not asserted: what a cold WebView2 costs on a
          # four-cpu runner is not this project's to hold to a number, and a
          # threshold nobody can defend is a red lane nobody believes. What it
          # is for is the shape -- how much of a launch is before the window,
          # and how much is the browser starting behind it.
          # Whether the browser actually got the switches this build sets, read
          # off the process table rather than inferred from a clock.
          #
          # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS is documented as the runtime's
          # variable, but the Evergreen path bypasses WebView2Loader.dll and
          # calls the runtime's own entry point -- so whether the variable is
          # read by the component this build still uses is a question about
          # someone else's code, and a timing delta cannot answer it. A command
          # line either carries `--no-first-run` or it does not. Reported and
          # not asserted while it is the first reading; it becomes an assertion
          # once there is a measured value to hold it to.
          $browsers = @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" -ErrorAction SilentlyContinue)
          $carrying = @($browsers | Where-Object { $_.CommandLine -like "*--no-first-run*" })
          Write-Output "report: browser processes=$($browsers.Count) carrying our arguments=$($carrying.Count)"
          if ($carrying.Count -gt 0) {
            $cl = $carrying[0].CommandLine
            Write-Output "report:   $($cl.Substring(0, [Math]::Min(220, $cl.Length)))"
          } elseif ($browsers.Count -gt 0) {
            $cl = $browsers[0].CommandLine
            Write-Output "report:   none carried them; one command line was:"
            Write-Output "report:   $($cl.Substring(0, [Math]::Min(220, $cl.Length)))"
          }
          $trace = ".\test\neutrinowarm\neutrino-trace.log"
          if (Test-Path $trace) {
            Write-Output "report: the startup path, unloaded:"
            Get-Content $trace | Select-Object -First 24 |
              ForEach-Object { Write-Output "report:   $_" }
          } else {
            Write-Output "report: the warm-up wrote no trace"
          }
          Get-Process | Where-Object { $_.MainWindowTitle -like "LOADERS*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "neutrinowarm" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0
      # A launch end to end, which the step above cannot give and never could.
      #
      # Its trace is the driver's, and the driver's clock starts at the driver's
      # first line -- so `201ms of this process before its first line` is the
      # newest line in it and the batch region is still missing entirely. That
      # region is another process, it runs before this one exists, and the only
      # place it can be read is from outside.
      #
      # Five launches of one app, numbered rather than averaged: run 1 compiles
      # the exe and creates a WebView2 profile and is not the launch anybody
      # complains about. The runs after it are what opening the app again costs,
      # split into the batch region, the CLR and the global code, the driver's
      # own phases, and then the frame and the title as a person sees them.
      #
      # Behind the warm-up, so the runtime is up and the numbers are a second
      # launch's rather than a first one's. Reported and not asserted, for the
      # reason the warm-up gives: what a launch costs on a four-cpu runner is
      # not this project's to hold to a number. What it is for is the shape,
      # and the two readings under it -- what a process start costs here, and
      # what the stamp's certutil costs -- are the numbers the launcher's own
      # comment about size and modification time has been waiting for.
      - shell: bash
        run: bash test/mkapp.sh --testing test/neutrinoloaders.js test/neutrinotime.cmd
      - name: launch time
        timeout-minutes: 10
        # continue-on-error, for the reason the sheet step gives: this is a
        # reporting tool. A lane that passed every control it has and goes red
        # because the thing measuring it would not parse is reporting about
        # itself -- and it took `core launch` down with it, which is a control.
        continue-on-error: true
        shell: pwsh
        run: |
          & .\test\launchtime.ps1 -Artifact test\neutrinotime.cmd -Runs 5 -Fresh *>&1 |
            Tee-Object -FilePath "$HOME\launchtime.log"
          exit 0
      # The netinstall step below has had a timeout all along and this one has
      # not, so anything that fails to exit here stops the whole run rather
      # than the step. The app not exiting is exactly what a missing close
      # handler produced.
      # Named, because a step with no `name` is titled after its first line and
      # this one's first line is now a comment: GitHub would report a timeout
      # here as `The action 'Run # `-Launch`, and no launcher line above it.'
      # has timed out`. The step used to be titled by the launcher it ran, and
      # it no longer runs one.
      - name: core launch
        timeout-minutes: 20
        shell: pwsh
        run: |
          # `-Launch`, and no launcher line above it. This step used to run the
          # batch and then start the verifier, which put the app's eleven-second
          # head start in a race against the verifier's cold start -- two
          # assembly loads and an `Add-Type` that shells out to the C# compiler.
          # Measured on two runs of one commit, from the compiler's last warning
          # to `=== Waiting for window ===`: 4.1s on one runner, 15.4s on
          # another forty minutes later. The slow one found the app at STEP1 and
          # failed it for a step it had performed correctly with nobody
          # watching. The head start has already been raised three times to pay
          # for this; the verifier launches the app itself now, so the expensive
          # part happens before there is anything to miss.
          #
          # The `launch under load` step below is the same order by accident --
          # its app spends two minutes reaching a window, so the verifier is
          # always ready first, which is why that step passed on the very runner
          # where this one went red.
          #
          # Wrapped, because a verifier that leaves by exception takes the log
          # assembly below with it -- which is how three red runs published two
          # section headers and nothing else. The verifier no longer throws on a
          # timeout; this is here for the ones nobody has thought of.
          $testExit = 0
          try {
              & .\test\verify-windows.ps1 -Launch *>&1 | Tee-Object -FilePath "$HOME\windows-verify.log"
              $testExit = $LASTEXITCODE
          } catch {
              "FAIL: verify-windows.ps1 ended by exception: $($_.Exception.Message)" |
                  Tee-Object -FilePath "$HOME\windows-verify.log" -Append
              $testExit = 1
          }
          # The launcher's own account, appended to the verifier's so one log
          # carries both. This step went red twice saying only that it
          # had reached "Step 0" -- which is a section header and not a pass --
          # and the app's side of it was in a file nothing read. A refusal
          # writes `neutrino: ...` here before any window exists.
          $errLog = "test\neutrinotest\neutrino-error.log"
          if (Test-Path $errLog) {
              Add-Content "$HOME\windows-verify.log" "=== the app's own account ==="
              Add-Content "$HOME\windows-verify.log" (Get-Content $errLog)
          } else {
              Add-Content "$HOME\windows-verify.log" "=== the app recorded no failure of its own ==="
          }
          Get-Process | Where-Object { $_.MainWindowTitle -ne "" } | Where-Object { $_.MainWindowTitle -like "*neutrino*" -or $_.MainWindowTitle -like "*STEP*" -or $_.MainWindowTitle -like "*TESTS DONE*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $testExit
      # The exe the batch region runs, which is now the one it just compiled.
      # Same finding as kde-appdir in a different mechanism: there the launcher
      # wrote the program every launch into a directory anyone could rewrite,
      # here it wrote it once and trusted a stamp beside it afterwards.
      - if: always()
        shell: bash
        run: bash test/mkapp.sh --testing test/neutrinoloaders.js test/neutrinocache.cmd
      - if: always()
        timeout-minutes: 15
        shell: pwsh
        run: |
          & .\test\appcache.ps1 .\test\neutrinocache.cmd *>&1 | Tee-Object -FilePath "$HOME\appcache.log"
          exit $LASTEXITCODE
      # The document the exe renders, and who gets to name it. It used to come
      # from NEUTRINO_SCRIPT_PATH, which the batch region set and netinstall's
      # allowlist passed through intact; getScriptPath derives it from the
      # exe's own location now, so the exe also runs when nothing launched it.
      # Two artifacts because the gate has two directions: the release build
      # must ignore the variable, and the testing build must still read it, or
      # a driver that reads it on no tier at all measures the same as one that
      # reads it on the right one.
      - if: always()
        shell: bash
        run: |
          bash test/mkapp.sh test/neutrinoloaders.js test/neutrinostandalone.cmd
          bash test/mkapp.sh --testing test/neutrinoloaders.js test/neutrinostandalone-testing.cmd
      - if: always()
        timeout-minutes: 15
        shell: pwsh
        run: |
          & .\test\standalone.ps1 .\test\neutrinostandalone.cmd .\test\neutrinostandalone-testing.cmd *>&1 |
              Tee-Object -FilePath "$HOME\standalone.log"
          exit $LASTEXITCODE
      # It launches the app some forty times over three probing modes, and the
      # first version of it was half an hour that nobody could overlap. Ninety
      # seconds now, which is what makes it a step again rather than a job.
      # Nothing here depends on what ran before it: it builds its own artifact
      # and measures the launch path's own file I/O, and it is gated
      # `if: always()` so it is measured whether or not appcache was.
      - if: always()
        shell: bash
        run: bash test/mkapp.sh --testing test/neutrinoloaders.js test/neutrinorace.cmd
      # The gap between the compile and the START, asserted shut. The batch
      # region MOVEs the freshly compiled exe onto a predictable name in the app
      # folder, writes a manifest, and only then STARTs it -- and appcache.ps1
      # measured that folder writable by everything running as this user. Three
      # probing rounds established the window is real in time (about 150 ms) and
      # shut in access: the name is open deny-write across all of it, and some
      # three hundred same-uid plant attempts a launch are refused every time,
      # rename ERROR_ACCESS_DENIED and overwrite ERROR_SHARING_VIOLATION. This
      # asserts none lands before the process starts, so the day a Windows
      # change opens the window the suite goes red and names the mode and round.
      - if: always()
        timeout-minutes: 15
        shell: pwsh
        run: |
          & .\test\exerace.ps1 .\test\neutrinorace.cmd *>&1 | Tee-Object -FilePath "$HOME\exerace.log"
          $raceExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "LOADERS*" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "neutrinorace" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $raceExit
      # A failed initialisation has to end, and has to leave a record. Both
      # halves were measured absent before this: the driver sat holding a modal
      # box ninety seconds after the download threw, and its app folder held
      # `neutrinoerr.exe`, its manifest and the build stamp and nothing that
      # named the failure. Provoked by pinning a version that does not exist, so
      # the package URL 404s and the download throws the way a digest mismatch
      # would -- the real path into handleError, with nothing about the driver
      # modified for the test.
      #
      # Two substitutions now, because the download is no longer the first thing
      # tried. The driver renders through the runtime the machine already has
      # and only fetches the package when it cannot, so a build with nothing but
      # a bad pin never reaches the pin at all -- it comes up perfectly well and
      # this suite measures nothing. Naming an export that does not exist is
      # what puts the download back in front of it.
      #
      # That makes this the suite that measures the fallback, which nothing else
      # does: an Evergreen path that fails has to end up on the package path,
      # and the only proof of it is a build that gets all the way to the 404.
      - if: always()
        shell: bash
        run: |
          bash test/mkapp.sh test/neutrinotest.js test/neutrinoerr.cmd
          sed -i 's/\(webView2PinnedVersion[ :=]*\)"[^"]*"/\1"0.0.0-neutrino-does-not-exist"/' test/neutrinoerr.cmd
          grep -q 'webView2PinnedVersion[ :=]*"0.0.0-neutrino-does-not-exist"' test/neutrinoerr.cmd
          sed -i 's/\(evergreenEntryExport[ :=]*\)"[^"]*"/\1"NeutrinoNoSuchExport"/' test/neutrinoerr.cmd
          grep -q 'evergreenEntryExport[ :=]*"NeutrinoNoSuchExport"' test/neutrinoerr.cmd
      - if: always()
        timeout-minutes: 10
        shell: pwsh
        run: |
          & .\test\verify-winerr.ps1 .\test\neutrinoerr.cmd *>&1 | Tee-Object -FilePath "$HOME\winerr-verify.log"
          $testExit = $LASTEXITCODE
          Get-Process -Name "neutrinoerr" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $testExit
      - if: always()
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: always()
        name: netinstall suite
        timeout-minutes: 20
        shell: bash
        env:
          NETINSTALL_CC: zig cc
        run: |
          # Redirected, and that is the whole of this comment. The batch region
          # STARTs a detached exe which inherits the standard handles, so with
          # the step's own pipe on the other end it stays open for as long as
          # the app lives -- and these apps are written never to close. Every
          # suite inside run.sh is bounded by nt_timeout, so the suite is reaped
          # and the orphan holding the pipe is not: the step then runs on past
          # its own timeout-minutes, measured at 37 minutes against a bound of
          # 20, and the rest of the lane never starts. A file has no reader to
          # wait on. The log is echoed afterwards by a process that does exit,
          # which is also what puts nt_result's lines back in front of the
          # runner -- redirecting without that would take the readings away
          # with the hang.
          #
          # PR 20 wrote this lesson down for a probe that piped the launcher.
          # This is the step on this lane that never got it.
          NT_EXIT=0
          # Where splash.sh puts its picture of the splash window and the six
          # frames of it moving; the sheet step below heads them as
          # netinstall's own.
          export NEUTRINO_SPLASH_SHOTS=$HOME/netinstall-screenshots
          # Measured on run 33750772253. See the gjs lane for why it is an
          # assertion and not a report.
          export NEUTRINO_SPLASH_EXPECT=win32
          bash netinstall/test/run.sh > ~/netinstall.log 2>&1 || NT_EXIT=$?
          cat ~/netinstall.log
          exit $NT_EXIT
      # The suite watched closely enough, on a runner that is busy.
      #
      # verify-windows used to wait for each of the app's titles in turn, and
      # between one wait returning and the next beginning it asserted, reported
      # and encoded a full-screen PNG. Measured here under load: that gap ran
      # to about three seconds against a state the app holds for one second, so
      # the next title was set and gone before anything looked for it, and the
      # wait after it spent its whole bound against a process that had finished
      # and exited. Every recorded symptom of the "Windows first-window stall"
      # is that.
      #
      # This is the measurement kept. On an idle runner the old design and the
      # new one both pass, so a green windows lane never had anything to say
      # about it; under cpus*3 spinners the old one lost a state 3/3 while a
      # 20-second dwell passed 3/3 under the same load
      # (https://github.com/alganet/neutrino/actions/runs/33033844619). The
      # suite now samples one process ten times a second and asserts its own
      # slowest turn against the dwell it reads out of the artifact -- so what
      # used to be a timeout with no account is a number, and this is where
      # that number is taken under pressure.
      #
      # Two replicas, because one run of one job is not a rate -- and that is
      # what they were a two-runner matrix for. Sequential here, on one
      # machine: what the matrix sampled and this does not is runner-to-runner
      # variance. What it keeps is two independent readings, and it keeps them
      # further apart than the matrix did -- separate artifacts and separate
      # app directories, so replica 2 cannot read a trace replica 1 left. It
      # asserts, so it can fail the run; the load is stopped whatever happens.
      - if: always()
        shell: bash
        run: |
          bash test/mkapp.sh --testing test/neutrinotest.js test/neutrinoload1.cmd
          bash test/mkapp.sh --testing test/neutrinotest.js test/neutrinoload2.cmd
      - name: launch under load
        if: always()
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:NEUTRINO_WEBVIEW2_LIB_DIR = $null
          $rc = 0
          foreach ($replica in "1", "2") {
            $artifact = "test\neutrinoload$replica.cmd"
            $appdir   = "test\neutrinoload$replica"
            $log      = "$HOME\load-verify-$replica.log"
            # Its own frames. verify-windows.ps1 names a screenshot after the
            # state it caught, and the core launch above runs the same script:
            # left in $HOME every one of these would land on a name something
            # else had already written.
            $shots    = "$HOME\load-shots-$replica"
            New-Item -ItemType Directory -Force -Path $shots | Out-Null
            Write-Output "report: replica $replica"
            $cpus = [Environment]::ProcessorCount
            $spinners = @()
            for ($i = 0; $i -lt $cpus * 3; $i++) {
              $spinners += Start-Process -FilePath "cmd.exe" -PassThru -WindowStyle Hidden `
                -ArgumentList "/c", "for /L %i in (1,0,2) do @rem"
            }
            Write-Output "report: load cpus=$cpus spinners=$($spinners.Count)"
            # Start-Process, not the launcher inline: the batch region STARTs a
            # detached exe which inherits the standard handles, and this step's
            # stdout is the runner's pipe -- which is how a netinstall step once
            # ran 37 minutes against a bound of 20 (PR 28). -WorkingDirectory
            # explicitly, because Start-Process takes the child's directory from
            # [Environment]::CurrentDirectory and not from $PWD.
            Start-Process -FilePath "cmd.exe" -WorkingDirectory $PWD `
              -ArgumentList "/c", $artifact -WindowStyle Hidden | Out-Null
            $r = 0
            try {
                & .\test\verify-windows.ps1 -Artifact $artifact -AppDir $appdir `
                    -ScreenshotDir $shots *>&1 |
                    Tee-Object -FilePath $log
                $r = $LASTEXITCODE
            } catch {
                "FAIL: verify-windows.ps1 ended by exception: $($_.Exception.Message)" |
                    Tee-Object -FilePath $log -Append
                $r = 1
            }
            foreach ($s in $spinners) {
              Stop-Process -Id $s.Id -Force -ErrorAction SilentlyContinue
            }
            # The app's own clock. note() had no channel on this platform at all
            # before this -- a detached winexe process gets NullStream for
            # Console.Error and both console spellings -- so a launch that lost a
            # state said nothing, for want of anywhere to say it.
            $traceLog = "$appdir\neutrino-trace.log"
            if (Test-Path $traceLog) {
                Add-Content $log "report: the app's own trace:"
                Get-Content $traceLog | Select-Object -Last 16 |
                    ForEach-Object { Add-Content $log "report:   $_" }
            } else {
                Add-Content $log "report: the app wrote no trace at all"
            }
            Get-Process -Name "neutrinoload$replica" -ErrorAction SilentlyContinue |
                Stop-Process -Force -ErrorAction SilentlyContinue
            if ($r -ne 0) { $rc = $r }
          }
          exit $rc
      # One upload for the lane. Six jobs meant six artifacts over the same
      # two globs in the same home directory, so every suite after the first
      # published the ones before it under its own name.
      # One artifact, one file: the lane's pictures and logs as a page that opens
      # in a browser. What it replaces is a directory of PNGs in a zip, which
      # made comparing the decorated frame against the chromeless one a matter
      # of extracting both and remembering the first while looking at the
      # second. The pictures are inlined, so there is nothing to fetch and
      # nothing to run.
      #
      # continue-on-error, because this is a reporting tool. A lane that passed
      # every control it has and goes red because the page builder tripped is
      # reporting about itself, and the thing it was built to report on is the
      # one nobody would then read.
      - name: sheet
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # Gathered rather than globbed in place: this lane's pictures and logs
          # sit loose in the profile directory beside everything else the
          # runner keeps there, and a recursive find pointed at $HOME would
          # sweep all of it.
          mkdir -p ~/sheetsrc
          cp ~/*.png ~/*.log ~/sheetsrc/ 2>/dev/null || true
          bash test/sheet.sh windows-launch ~/sheet/windows-launch.html \
            "The suites=$HOME/sheetsrc" \
            "netinstall=$HOME/netinstall-screenshots" \
            "Under load, replica 1=$HOME/load-shots-1" \
            "Under load, replica 2=$HOME/load-shots-2"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-launch-sheet
          path: ~/sheet/windows-launch.html

  # What the page is allowed to do, and what the driver does with a document
  # that is not the one it was handed: hostile page content, the navigation
  # surface, the offline tier, and the swap between `boot`'s read of the
  # document and the driver's.
  #
  # The offline suite and docswap were already sharing a job for this reason;
  # the attack and navigation suites join them because they ask the same
  # question of the same driver. Every group is gated `if: always()`, so a red
  # offline tier does not hide whether docswap passed -- the failure that cost
  # a whole round when all of this sat in one long lane.
  # Measured against a complete run rather than guessed: this lane took 14.8 min measured.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  windows-content:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: bash test/mkapp.sh test/neutrinoattack.js test/neutrinoattack.cmd
      # The suites this lane is made of, parsed before any of them runs, for
      # the same reason the compile below happens first -- see psparse.ps1.
      - timeout-minutes: 5
        shell: pwsh
        run: |
          & .\test\psparse.ps1 *>&1 | Tee-Object -FilePath "$HOME\psparse.log"
          exit $LASTEXITCODE
      # Before anything is launched, because an artifact that does not compile
      # is an app that never appears -- and every suite that waits for a window
      # then waits out its own timeout before saying so. One reserved word in
      # the jsc region cost this lane its runner that way: three suites spent
      # fifty minutes between them against a forty-minute job, the run was
      # killed in the middle of the fourth, and GitHub keeps no logs for a job
      # killed like that. The compiler had said exactly what was wrong, once, on
      # the first launch of the first suite.
      #
      # A second or so, and it compiles the artifact the way the launcher does
      # -- with the reference list read out of the artifact's own jsc line.
      - timeout-minutes: 5
        shell: pwsh
        run: |
          & .\test\compile.ps1 test\neutrinoattack.cmd *>&1 | Tee-Object -FilePath "$HOME\compile.log"
          exit $LASTEXITCODE
      - timeout-minutes: 15
        shell: pwsh
        run: |
          .\test\neutrinoattack.cmd
          & .\test\verify-attack.ps1 *>&1 | Tee-Object -FilePath "$HOME\attack-verify.log"
          $testExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "ATTACK *" } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $testExit
      # A note this lane was carrying and should not: `postnav=PENDING
      # nav=PENDING` here is not the earliest of several reports, and the
      # Select-Object -First 8 was not truncating anything. verify-attack.ps1
      # prints `report:` exactly once, after settling, and says in its own
      # comment that the settled report is not expected to arrive on this
      # platform because there is no navigation refusal to refuse with.
      # Measured: matched=1 reports=1.
      # The navigation lane. The Windows driver subscribes to NavigationStarting
      # and NewWindowRequested now, and this is the suite that says so: against
      # a target that answers, the driver without a guard reported
      # nav_arrived=YES and popup_arrived=YES opened=HANDLE, with the injected
      # API and the app author's own page script both present in the remote
      # document. test/neutrinoattack.js could never see this -- it aims at a
      # host that never resolves, which test/early-target.html's own comment
      # calls not a test, because the load fails on its own and a driver with a
      # guard reports the same "held" as one without.
      #
      # This suite and the attack suite above it share the windows-content lane
      # with the offline tier and docswap, and every group in it is gated
      # `if: always()`: when they sat mid-lane ungated, a build ahead of them
      # failing skipped the assertion steps behind it. The gate is what keeps
      # an unrelated red from hiding whether these passed -- it is the property
      # the four-job split was bought for, kept without the four jobs.
      - if: always()
        shell: bash
        run: bash test/mkapp.sh --overlay test/nav-hermetic test/neutrinonav.js test/neutrinonav.cmd
      - if: always()
        timeout-minutes: 12
        shell: pwsh
        run: |
          & .\test\verify-nav.ps1 .\test\neutrinonav.cmd "$HOME\navlogs" *>&1 |
            Tee-Object -FilePath "$HOME\navlogs-full.log"
          $navExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "NAV-*" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $navExit
      - if: always()
        shell: bash
        run: cat ~/navlogs/nav.log
      - if: always()
        shell: bash
        run: bash test/mkapp.sh --testing test/neutrinodoc.js test/neutrinodoc.cmd
      - if: always()
        timeout-minutes: 20
        shell: pwsh
        run: |
          & .\test\docswap.ps1 .\test\neutrinodoc.cmd "$HOME\docswaplogs" *>&1 |
            Tee-Object -FilePath "$HOME\docswap-full.log"
          $swapExit = $LASTEXITCODE
          Get-Process | Where-Object { $_.MainWindowTitle -like "DOCSWAP*" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $swapExit
      - if: always()
        shell: bash
        run: cat ~/docswaplogs/docswap.log
      # The web-standards probe, round 1: the apparatus, and nothing else.
      #
      # Two questions were opened here. Whether an app can be written against
      # `window.resizeTo` and `window.outerWidth` instead of against
      # `neutrino.window.resize` and nothing at all; and whether an assignment
      # to `document.title` reaches the native title. Both are answered now --
      # the standard spellings are written over the engine's, and the launcher
      # connects each engine's title-changed signal to the window -- and
      # neither was answered by this round. What this round is for is the instruments: verify-std.sh records
      # a window's title and geometry in one loop with nothing slow in it, and
      # until that loop is known to read a live window and to see it change,
      # every pair of numbers it prints later is unattributable.
      #
      # So both apps mutate the window through the API that already works, and
      # the verifier fails its own control when it cannot see the mutation. A
      # run where the harness reads the same geometry either side of a resize
      # has not measured the engine's `outerWidth`; it has measured a window
      # that never moved, or an instrument pointed at the wrong one.
      #
      # Last in the lane and `if: always()`, which is both halves of one rule.
      # A probe must not fail a lane -- these verifiers exit non-zero only when
      # a control fails, never for a reading. And a lane must not fail a probe,
      # which is what the gate buys: a suite ahead of this going red for
      # unrelated reasons once skipped the probe behind it and cost a whole
      # round for a step that could not have made the lane worse.
      #
      # The two probes are separate steps and separate apps. The geometry app
      # is written never to close, so if the first step fails to reap it its
      # window is still up when the second begins -- which is why they search
      # for `^STD-GEOM-` and `^STD-DOC-` and not for a shared prefix.
      - if: always()
        shell: bash
        run: |
          bash test/mkapp.sh --testing test/neutrinostdgeom.js test/neutrinostdgeom.cmd
          bash test/parse.sh test/neutrinostdgeom.cmd
          bash test/mkapp.sh --testing --decorations=none test/neutrinostdgeom.js test/neutrinostdgeom-none.cmd
          bash test/parse.sh test/neutrinostdgeom-none.cmd
          bash test/mkapp.sh --testing test/neutrinostddoc.js test/neutrinostddoc.cmd
          bash test/parse.sh test/neutrinostddoc.cmd
      # Both halves and the differential, in place of the single launch this
      # step used to make -- the decorated half is that launch, it runs first
      # because it is the control, and its verifier exit is carried into this
      # step's exit the way it always was. decoflip.ps1 reaps each half itself;
      # the sweep below is the belt to its braces.
      #
      # Named, and the budget is doubled with the work: a step with no `name`
      # is titled after its first line, and when this one timed out the failure
      # read `The action 'Run # Both halves and the differential, in place of
      # the single launch this' has timed out`. Twenty minutes was one probe's
      # budget and this step runs two, on the slowest lane, the first of which
      # may be fetching WebView2.
      - if: always()
        name: stdgeom (decorated and chromeless)
        timeout-minutes: 14
        shell: pwsh
        run: |
          & .\test\decoflip.ps1 -Decorated neutrinostdgeom -Chromeless neutrinostdgeom-none `
            -ScreenshotDir $env:USERPROFILE *>&1 |
            Tee-Object -FilePath "$HOME\stdgeom.log"
          $e = $LASTEXITCODE
          Get-Content "$HOME\deco-a.log","$HOME\deco-b.log" -ErrorAction SilentlyContinue
          foreach ($n in @("neutrinostdgeom","neutrinostdgeom-none")) {
            Get-Process -Name $n -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }
          exit $e
      - if: always()
        timeout-minutes: 10
        shell: pwsh
        run: |
          & .\test\verify-std.ps1 -Probe doc -ScreenshotDir $env:USERPROFILE `
            -Launch -Artifact .\test\neutrinostddoc.cmd *>&1 |
            Tee-Object -FilePath "$HOME\stddoc.log"
          $e = $LASTEXITCODE
          Get-Process -Name neutrinostddoc -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $e
      # Round 2. Whether the standard window verbs do anything and can be
      # taken over if they do not, and whether `neutrino.theme` is redundant
      # with CSS. Round 1 is what earns these their place: it said the
      # recording loop keeps up on every lane, that the size arithmetic agrees
      # with the one engine that reports its own outer size, and -- on macOS --
      # that the file this platform reads titles through was being written
      # wrong. Stacking these on an unvalidated instrument would have made one
      # red cost four readings instead of one.
      #
      # The window probe's own control is the phase order: the launcher's API
      # is exercised *after* the four native calls, because "resizeTo did
      # nothing" and "the window stopped responding" are the same reading
      # otherwise. The theme probe's is a colour keyword no engine can resolve,
      # so that "unsupported" is distinguishable from a value -- and this round
      # deliberately does not flip the desktop palette, so it reports what each
      # engine says and settles nothing about where the value came from.
      - if: always()
        shell: bash
        run: |
          bash test/mkapp.sh --testing test/neutrinostdwin.js test/neutrinostdwin.cmd
          bash test/parse.sh test/neutrinostdwin.cmd
          bash test/mkapp.sh --testing test/neutrinostdtheme.js test/neutrinostdtheme.cmd
          bash test/parse.sh test/neutrinostdtheme.cmd
      - if: always()
        timeout-minutes: 12
        shell: pwsh
        run: |
          & .\test\verify-std.ps1 -Probe win -ScreenshotDir $env:USERPROFILE `
            -Launch -Artifact .\test\neutrinostdwin.cmd *>&1 |
            Tee-Object -FilePath "$HOME\stdwin.log"
          $e = $LASTEXITCODE
          Get-Process -Name neutrinostdwin -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $e
      - if: always()
        timeout-minutes: 10
        shell: pwsh
        run: |
          & .\test\verify-std.ps1 -Probe theme -ScreenshotDir $env:USERPROFILE `
            -Launch -Artifact .\test\neutrinostdtheme.cmd *>&1 |
            Tee-Object -FilePath "$HOME\stdtheme.log"
          $e = $LASTEXITCODE
          Get-Process -Name neutrinostdtheme -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $e
      # Round 3: where each colour came from.
      #
      # The single-launch theme step above says what an engine reports and
      # nothing about provenance, and that gap is not hypothetical. WebKit
      # hardcodes Highlight one unit from Adwaita's accent, so on a default
      # GNOME desktop it reads exactly like an engine following the palette --
      # round 2 recorded it as doing so, and it does not. Flipped to
      # Adwaita:dark the desktop's accent moved and Highlight did not.
      #
      # So this launches twice with the desktop flipped between and asks one
      # question of each value: did it move. themeflip.sh owns the sequencing
      # because two parts of it are easy to get wrong and invisible in YAML --
      # the knob is cleared before it is set, each half, and the second half
      # refuses to start while the first half's window is still up, since both
      # answer to the same title prefix and a stale reading does not announce
      # itself.
      #
      # The differential's middle control is what fails a lane whose knob does
      # not work: better a red step that says the flip did not take than a
      # green one reporting fifteen constants it never disturbed. Last in the
      # lane and gated, so that costs its own reading and nothing else.
      - if: always()
        shell: bash
        run: |
          bash test/mkapp.sh --testing test/neutrinostdtheme.js test/neutrinostdtheme.cmd
          bash test/parse.sh test/neutrinostdtheme.cmd
      - if: always()
        timeout-minutes: 16
        shell: pwsh
        run: |
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          function Set-AppsTheme($light) {
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value $light -Type DWord
            Set-ItemProperty -Path $key -Name SystemUsesLightTheme -Value $light -Type DWord
          }
          # What the machine says the knob is at, asked after it was set and
          # from outside the app -- the same reading themeflip.sh takes on the
          # unix lanes, and for the same reason. Without it a half reports the
          # value it *wrote*, and a lane where nothing moved cannot say whether
          # the registry refused the write or the app never read it. Those are
          # an apparatus defect and a finding, and they look identical.
          function Read-Knob($tag) {
            $apps = (Get-ItemProperty -Path $key -Name AppsUseLightTheme -ErrorAction SilentlyContinue).AppsUseLightTheme
            $sys  = (Get-ItemProperty -Path $key -Name SystemUsesLightTheme -ErrorAction SilentlyContinue).SystemUsesLightTheme
            $ctl  = [System.Drawing.SystemColors]::Control
            # The classic palette is carried too, because on Windows it is the
            # one thing expected *not* to move: SystemColors stays at its light
            # values in either scheme, which is why the driver overrides the
            # surfaces from the registry rather than reading them. A round that
            # sees it move has found something nobody here predicted.
            "report: knob $tag AppsUseLightTheme=$(if ($null -eq $apps) {'<absent:light>'} else {$apps}) " +
              "SystemUsesLightTheme=$(if ($null -eq $sys) {'<absent:light>'} else {$sys}) " +
              "SystemColors.Control=$($ctl.R),$($ctl.G),$($ctl.B)"
          }
          function Run-Half($tag, $shot) {
            Add-Type -AssemblyName System.Drawing
            Read-Knob $tag | Tee-Object -FilePath "$HOME\flip-knobs.log" -Append | Write-Host
            & .\test\verify-std.ps1 -Probe theme -ScreenshotDir $env:USERPROFILE `
              -ShotName "theme-$shot" -Launch -Artifact .\test\neutrinostdtheme.cmd *>&1 |
              Tee-Object -FilePath "$HOME\flip-$tag.log" | Out-Null
            Get-Process -Name neutrinostdtheme -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            # The precondition the unix half states out loud: the next launch
            # must not find this one's window.
            $n = 0
            while ($n -lt 60 -and (Get-Process -Name neutrinostdtheme -ErrorAction SilentlyContinue)) {
              Start-Sleep -Milliseconds 500; $n++
            }
          }
          Set-AppsTheme 1
          Run-Half a light
          Set-AppsTheme 0
          Run-Half b dark
          Set-AppsTheme 1
          exit 0
      - if: always()
        shell: bash
        run: |
          TEST_EXIT=0
          # The knob readings first, so the differential below is read beside
          # the two states it is a differential of.
          cat ~/flip-knobs.log > ~/themediff.log 2>/dev/null || true
          bash test/themediff.sh ~/flip-a.log ~/flip-b.log >> ~/themediff.log 2>&1 || TEST_EXIT=$?
          cat ~/flip-a.log ~/flip-b.log ~/themediff.log 2>/dev/null || true
          exit $TEST_EXIT
      # And the live half, which is the one thing the two above cannot see.
      #
      # They launch under one app theme each and compare, which is right for
      # "did this value come from the desktop" and wrong for "does the watcher
      # work": the palette is read once at startup either way, so a watcher
      # that never fired would leave both of them green. Measured on a Windows
      # 11 client before this step existed -- an accent moved through
      # SetSysColors under a running app arrived as four palettes, and a real
      # contrast theme as one more -- so what this adds is a runner that says
      # so rather than a person with a VM.
      - if: always()
        shell: bash
        run: |
          bash test/mkapp.sh --testing test/neutrinolivetheme.js test/neutrinolivetheme.cmd
          bash test/parse.sh test/neutrinolivetheme.cmd
      - if: always()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $testExit = 0
          & .\test\themelive.ps1 -Artifact .\test\neutrinolivetheme.cmd *>&1 |
            Tee-Object -FilePath "$HOME\themelive.log"
          if ($LASTEXITCODE -ne 0) { $testExit = $LASTEXITCODE }
          Get-Process -Name neutrinolivetheme -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $testExit
      # The app on the download page, and this is the lane it broke on.
      #
      # Everything else here builds a probe written by someone who knew which
      # lanes need a document waited for. pages/demo is written the way the
      # README tells an author to write an app, and it is what people actually
      # download -- so its Close button doing nothing on Windows, and working
      # everywhere else, was found by a person on Windows Home rather than by
      # anything in this file.
      #
      # A release build, deliberately: everything else on this lane is
      # --testing because it needs the trace channel, and the thing under test
      # here is the download.
      - if: always()
        shell: bash
        run: |
          bash test/demoapp.sh test/neutrinodemo.cmd
          bash test/parse.sh test/neutrinodemo.cmd
      - if: always()
        name: the app on the download page
        timeout-minutes: 10
        shell: pwsh
        run: |
          & .\test\demo.ps1 -ScreenshotDir $env:USERPROFILE *>&1 |
            Tee-Object -FilePath "$HOME\demo.log"
          $e = $LASTEXITCODE
          Get-Process -Name neutrinodemo -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit $e
      # One artifact, one file: the lane's pictures and logs as a page that opens
      # in a browser. What it replaces is a directory of PNGs in a zip, which
      # made comparing the decorated frame against the chromeless one a matter
      # of extracting both and remembering the first while looking at the
      # second. The pictures are inlined, so there is nothing to fetch and
      # nothing to run.
      #
      # continue-on-error, because this is a reporting tool. A lane that passed
      # every control it has and goes red because the page builder tripped is
      # reporting about itself, and the thing it was built to report on is the
      # one nobody would then read.
      - name: sheet
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ~/sheetsrc
          cp ~/*.png ~/*.log ~/sheetsrc/ 2>/dev/null || true
          bash test/sheet.sh windows-content ~/sheet/windows-content.html \
            "The suites=$HOME/sheetsrc" \
            "docswap=$HOME/docswaplogs" \
            "nav=$HOME/navlogs" \
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-content-sheet
          path: ~/sheet/windows-content.html

  # Everything this platform has to say about a running app: the core launch

  # the loader environment, hostile content, a page that navigates before its
  # own load finished, and the navigation guard's account of itself.
  #
  # Four macOS jobs before this, and three of them came to five minutes
  # between them. Everything after the core launch is gated `if: always()`.
  #
  # One upload at the end: all four jobs pointed at ~/screenshots, so the
  # separate artifacts were separate names over the same directory.
  # Measured against a complete run rather than guessed: this lane took 11.4 min measured.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash test/mkapp.sh --testing test/neutrinotest.js test/neutrinotest.cmd
      - run: bash test/parse.sh test/neutrinotest.cmd
      # The launcher's own seatbelt profile, asserted as a value: that it can be
      # built inside a profile that denies /tmp, that the text is the same
      # either way, that seatbelt takes it, and that what seatbelt takes
      # confines. Every other macOS step here launches the launcher and then
      # asks about the window, and the window comes up with the profile
      # silently missing -- which is how a here-document in a shell whose
      # here-documents go to /tmp cost every netinstall launch its inner
      # profile without one step going red. No display, no engine, about a
      # second, so it sits with parse.sh at the top of the lane.
      #
      # Handed the artifact parse.sh just read, for parse.sh's own reason: this
      # asserts what shipped, and the `@@include` that puts macos-confine.sh
      # into a build is the step most able to go wrong. Naming it also keeps
      # this step off assemble.sh, which it would otherwise call for itself.
      - run: bash test/confine-macos.sh test/neutrinotest.cmd
      # The engine walk, on the platform whose order it is now about. lanes.sh
      # is stub-driven and needs no display, and it ran on three Linux lanes and
      # nowhere else -- so the two assertions that name osascript had never
      # executed, and the ordering this lane depends on was asserted only where
      # osascript does not exist.
      - run: bash test/lanes.sh test/neutrinotest.cmd
      # The assembler, and the stamp it says it applied. Pure shell, no display
      # and about a second, so it runs beside parse.sh on every lane that
      # assembles anything -- once per sed, because the spelling of what it
      # asserts is sed's and the three seds here are not the same program. gjs
      # is the GNU one, windows-launch is MSYS, macos is BSD. kde is
      # ubuntu-latest as well and used to run it a fourth time against the very
      # same GNU sed, which is the rule being read as "every lane" rather than
      # as what it says. Every defect is measured against `oldbuild.sh`, the
      # assembler as it shipped through PR 23, carried inside the suite.
      #
      # Bounded, because the first version of it was not: it launched the
      # artifact and waited on it, the Windows lane went from twelve minutes to
      # fifty and lost its runner, and a lane that dies publishes nothing -- so
      # which step blocked was not readable afterwards. The suite no longer
      # starts anything whose exit it does not control, and this is the second
      # half of that.
      - timeout-minutes: 5
        run: |
          TEST_EXIT=0
          bash test/assemble.sh > ~/assemble.log 2>&1 || TEST_EXIT=$?
          cat ~/assemble.log
          exit $TEST_EXIT
      # The room, before anything is photographed in it.
      #
      # Every picture this lane published in the last run carried the macOS
      # re-authorisation alert -- "bash is requesting to bypass the system
      # private window picker" -- centred on the display, over the app. It is
      # raised by the first capture of the job and never times out, so one alert
      # sits in all fourteen frames. Cropping to the window used to hide it, and
      # hiding it is what the pictures stopped doing.
      #
      # This step is an experiment and not a control: it names the process that
      # presents the alert, tries the two things that might dismiss it, and
      # prints what happened at each stage. It cannot fail the lane -- the
      # script exits 0 whatever it finds -- and its whole output is a reading
      # for the next round. Before the launch, because the point is to have the
      # room settled before the first shutter, and because its own throwaway
      # capture is then the one that provokes the alert rather than `00-initial`.
      - name: the room the pictures are taken in
        timeout-minutes: 3
        continue-on-error: true
        run: |
          bash test/shotroom-macos.sh > ~/shotroom.log 2>&1 || true
          cat ~/shotroom.log
      # The last step in any lane with no way to be read, and it cost a merge.
      # It went red publishing nothing at all: verify-macos.sh exits before its
      # first screenshot when the window does not appear, so the artifact upload
      # found nothing either, and the app's own account went to a log that was
      # catted into the job log and carried no further. Same treatment as the
      # other five, and the timeout the netinstall step has had all along.
      #
      # The app's output is appended to the verifier's log rather than dumped
      # into a step of its own, so one file carries both sides of the launch.
      - timeout-minutes: 20
        run: |
          echo "=== Launching app ==="
          # The status file is one fixed path and every testing-tier build on
          # this lane writes it, the loaders step included. Cleared before the
          # launch and not inside the verifier, which would race the app it is
          # waiting for: a title left by the previous step is a reading
          # attributed to this one, and it looks exactly like a real one.
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinotest.cmd > ~/neutrino-stdout.log 2>&1 &
          APP_PID=$!
          # Steps run under bash -e, so a failing verifier aborts this block
          # where it stands. Written as "cmd; VAR=$?" the app's output below is
          # unreachable on exactly the runs that need it, which is why the last
          # one reported a window and nothing else.
          TEST_EXIT=0
          APP_PID=$APP_PID bash test/verify-macos.sh ~/screenshots \
            > ~/macos-verify.log 2>&1 || TEST_EXIT=$?
          kill "$APP_PID" 2>/dev/null || true
          cat ~/macos-verify.log
          echo "=== app output ==="
          cat ~/neutrino-stdout.log || true
          {
            echo "=== the app's own account ==="
            cat ~/neutrino-stdout.log 2>/dev/null || true
          } >> ~/macos-verify.log
          exit $TEST_EXIT
      # The loader environment the standalone launch path hands its engine.
      # Every check here is against the same build with the fix cut out of it,
      # so "it would have failed before" is measured in this run rather than
      # claimed. Two builds go in: the testing tier, because the suite has to
      # know the app came up and on two lanes that is scaffolding -- the macOS
      # driver writes its title to a file only there, and Qt's Chromium needs
      # the no-sandbox flag this container cannot do without -- and the default
      # tier, which is the only build the sandbox section can ask its question
      # of, since the testing tier is what puts --no-sandbox on the command
      # line. Neither tier touches the environment.
      - if: always()
        timeout-minutes: 12
        run: |
          bash test/mkapp.sh --testing test/neutrinoloaders.js test/neutrinoloaders.cmd
          TEST_EXIT=0
          bash test/loaders.sh test/neutrinoloaders.cmd > ~/loaders.log 2>&1 || TEST_EXIT=$?
          cat ~/loaders.log
          exit $TEST_EXIT
      - if: always()
        run: |
          bash test/mkapp.sh --testing test/neutrinoattack.js test/neutrinoattack.cmd
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinoattack.cmd > ~/neutrino-attack.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-attack.sh > ~/attack-verify.log 2>&1 || TEST_EXIT=$?
          bash test/reap.sh neutrinoattack ATTACK
          cat ~/attack-verify.log
          echo "=== app output ==="
          cat ~/neutrino-attack.log || true
          exit $TEST_EXIT
      # Recorded here rather than asserted: this driver has no navigation
      # delegate to arm at all, which is PR 6's business. The testing tier is
      # what writes the status file the verifier reads.
      - if: always()
        run: |
          python3 test/stall.py 8099 > ~/stall.log 2>&1 &
          STALL_PID=$!
          # Where the page under test navigates to. It has to answer: with a
          # host that never resolves the navigation fails on its own and every
          # driver reports "held", guard or no guard -- measured on macOS.
          # This does not return until it is serving, so the app below cannot
          # navigate into a port nothing has bound yet.
          PAGES_PID="$(bash test/serve-target.sh ~/pages.log)"
          bash test/mkapp.sh --testing test/neutrinoearly.js test/neutrinoearly.cmd
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/neutrinoearly.cmd > ~/early.log 2>&1 &
          TEST_EXIT=0
          bash test/verify-early.sh > ~/early-verify.log 2>&1 || TEST_EXIT=$?
          bash test/reap.sh neutrinoearly EARLY
          kill "$STALL_PID" 2>/dev/null || true
          kill "$PAGES_PID" 2>/dev/null || true
          cat ~/early-verify.log
          echo "=== app output ==="
          cat ~/early.log || true
          exit $TEST_EXIT
      # The navigation guard PR 6 built, and the account it gives of itself.
      #
      # It shipped spelled `webViewRef.stopLoading()`, and JXA runs a
      # zero-argument selector when the property is read -- so the read stopped
      # the load and the `()` after it threw, and for four PRs the guard refused
      # every navigation and logged that it could not. Nothing here could catch
      # that: verify-attack.sh aims at a host that never resolves, so its `nav`
      # field is free whatever the guard does, and verify-early.sh asserts
      # `at=held` with no control -- and `held` was the reading before the fix
      # and after it, because the guard was working the whole time.
      #
      # So this asserts the effect and the account separately, against a control
      # that is this artifact with the refusal deleted and against the spelling
      # the fix replaced. Three launches of the same build, one line apart.
      - if: always()
        timeout-minutes: 12
        run: |
          bash test/mkapp.sh --testing test/neutrinoearly.js test/neutrinonavrefuse.cmd
          TEST_EXIT=0
          bash test/navrefuse.sh test/neutrinonavrefuse.cmd > ~/navrefuse.log 2>&1 || TEST_EXIT=$?
          cat ~/navrefuse.log
          exit $TEST_EXIT
      # The web-standards probe, round 1: the apparatus, and nothing else.
      #
      # Two questions were opened here. Whether an app can be written against
      # `window.resizeTo` and `window.outerWidth` instead of against
      # `neutrino.window.resize` and nothing at all; and whether an assignment
      # to `document.title` reaches the native title. Both are answered now --
      # the standard spellings are written over the engine's, and the launcher
      # connects each engine's title-changed signal to the window -- and
      # neither was answered by this round. What this round is for is the instruments: verify-std.sh records
      # a window's title and geometry in one loop with nothing slow in it, and
      # until that loop is known to read a live window and to see it change,
      # every pair of numbers it prints later is unattributable.
      #
      # So both apps mutate the window through the API that already works, and
      # the verifier fails its own control when it cannot see the mutation. A
      # run where the harness reads the same geometry either side of a resize
      # has not measured the engine's `outerWidth`; it has measured a window
      # that never moved, or an instrument pointed at the wrong one.
      #
      # Last in the lane and `if: always()`, which is both halves of one rule.
      # A probe must not fail a lane -- these verifiers exit non-zero only when
      # a control fails, never for a reading. And a lane must not fail a probe,
      # which is what the gate buys: a suite ahead of this going red for
      # unrelated reasons once skipped the probe behind it and cost a whole
      # round for a step that could not have made the lane worse.
      #
      # The two probes are separate steps and separate apps. The geometry app
      # is written never to close, so if the first step fails to reap it its
      # window is still up when the second begins -- which is why they search
      # for `^STD-GEOM-` and `^STD-DOC-` and not for a shared prefix.
      - if: always()
        timeout-minutes: 14
        run: |
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/mkapp.sh --testing test/neutrinostdgeom.js test/neutrinostdgeom.cmd
          bash test/mkapp.sh --testing --decorations=none test/neutrinostdgeom.js test/neutrinostdgeom-none.cmd
          bash test/parse.sh test/neutrinostdgeom.cmd
          bash test/parse.sh test/neutrinostdgeom-none.cmd
          TEST_EXIT=0
          # Both halves and the differential, in place of the single launch
          # this step used to make. The decorated half is that launch: it runs
          # first, it is the control, and its verifier exit is carried into
          # this step's exit the way it always was.
          bash test/decoflip.sh test/neutrinostdgeom.cmd test/neutrinostdgeom-none.cmd ~/screenshots > ~/stdgeom.log 2>&1 || TEST_EXIT=$?
          cat ~/deco-a.log ~/deco-b.log ~/stdgeom.log
          exit $TEST_EXIT
      - if: always()
        timeout-minutes: 8
        run: |
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/mkapp.sh --testing test/neutrinostddoc.js test/neutrinostddoc.cmd
          bash test/parse.sh test/neutrinostddoc.cmd
          bash test/neutrinostddoc.cmd > ~/stddoc-app.log 2>&1 &
          APP_PID=$!
          TEST_EXIT=0
          bash test/verify-std.sh doc ~/screenshots > ~/stddoc.log 2>&1 || TEST_EXIT=$?
          pkill -P "$APP_PID" 2>/dev/null || true
          kill "$APP_PID" 2>/dev/null || true
          cat ~/stddoc.log
          exit $TEST_EXIT
      # Round 2. Whether the standard window verbs do anything and can be
      # taken over if they do not, and whether `neutrino.theme` is redundant
      # with CSS. Round 1 is what earns these their place: it said the
      # recording loop keeps up on every lane, that the size arithmetic agrees
      # with the one engine that reports its own outer size, and -- on macOS --
      # that the file this platform reads titles through was being written
      # wrong. Stacking these on an unvalidated instrument would have made one
      # red cost four readings instead of one.
      #
      # The window probe's own control is the phase order: the launcher's API
      # is exercised *after* the four native calls, because "resizeTo did
      # nothing" and "the window stopped responding" are the same reading
      # otherwise. The theme probe's is a colour keyword no engine can resolve,
      # so that "unsupported" is distinguishable from a value -- and this round
      # deliberately does not flip the desktop palette, so it reports what each
      # engine says and settles nothing about where the value came from.
      - if: always()
        timeout-minutes: 10
        run: |
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/mkapp.sh --testing test/neutrinostdwin.js test/neutrinostdwin.cmd
          bash test/parse.sh test/neutrinostdwin.cmd
          bash test/neutrinostdwin.cmd > ~/stdwin-app.log 2>&1 &
          APP_PID=$!
          TEST_EXIT=0
          bash test/verify-std.sh win ~/screenshots > ~/stdwin.log 2>&1 || TEST_EXIT=$?
          pkill -P "$APP_PID" 2>/dev/null || true
          kill "$APP_PID" 2>/dev/null || true
          cat ~/stdwin.log
          exit $TEST_EXIT
      - if: always()
        timeout-minutes: 8
        run: |
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/mkapp.sh --testing test/neutrinostdtheme.js test/neutrinostdtheme.cmd
          bash test/parse.sh test/neutrinostdtheme.cmd
          bash test/neutrinostdtheme.cmd > ~/stdtheme-app.log 2>&1 &
          APP_PID=$!
          TEST_EXIT=0
          bash test/verify-std.sh theme ~/screenshots > ~/stdtheme.log 2>&1 || TEST_EXIT=$?
          pkill -P "$APP_PID" 2>/dev/null || true
          kill "$APP_PID" 2>/dev/null || true
          cat ~/stdtheme.log
          exit $TEST_EXIT
      # Round 3: where each colour came from.
      #
      # The single-launch theme step above says what an engine reports and
      # nothing about provenance, and that gap is not hypothetical. WebKit
      # hardcodes Highlight one unit from Adwaita's accent, so on a default
      # GNOME desktop it reads exactly like an engine following the palette --
      # round 2 recorded it as doing so, and it does not. Flipped to
      # Adwaita:dark the desktop's accent moved and Highlight did not.
      #
      # So this launches twice with the desktop flipped between and asks one
      # question of each value: did it move. themeflip.sh owns the sequencing
      # because two parts of it are easy to get wrong and invisible in YAML --
      # the knob is cleared before it is set, each half, and the second half
      # refuses to start while the first half's window is still up, since both
      # answer to the same title prefix and a stale reading does not announce
      # itself.
      #
      # The differential's middle control is what fails a lane whose knob does
      # not work: better a red step that says the flip did not take than a
      # green one reporting fifteen constants it never disturbed. Last in the
      # lane and gated, so that costs its own reading and nothing else.
      - if: always()
        timeout-minutes: 14
        run: |
          rm -f "${TMPDIR:-/tmp}/neutrino-title.txt"
          bash test/mkapp.sh --testing test/neutrinostdtheme.js test/neutrinostdtheme.cmd
          bash test/parse.sh test/neutrinostdtheme.cmd
          # The live half's probe, built and parse-checked here with the other
          # one. themeflip.sh builds it itself when it is missing, so this step
          # is what puts it through parse.sh rather than what makes the half run.
          bash test/mkapp.sh --testing test/neutrinolivetheme.js test/neutrinolivetheme.cmd
          bash test/parse.sh test/neutrinolivetheme.cmd
          TEST_EXIT=0
          bash test/themeflip.sh macos test/neutrinostdtheme.cmd ~/screenshots \
            test/neutrinolivetheme.cmd \
            > ~/themediff.log 2>&1 || TEST_EXIT=$?
          # Both halves' own logs, beside the differential that read them, and
          # the live half's app log -- which is where a driver that raised on
          # its way to the theme says so.
          cat ~/flip-a.log ~/flip-b.log ~/flip-live-app.log ~/themediff.log 2>/dev/null || true
          exit $TEST_EXIT
      # One artifact, one file: the lane's pictures and logs as a page that opens
      # in a browser. What it replaces is a directory of PNGs in a zip, which
      # made comparing the decorated frame against the chromeless one a matter
      # of extracting both and remembering the first while looking at the
      # second. The pictures are inlined, so there is nothing to fetch and
      # nothing to run.
      #
      # continue-on-error, because this is a reporting tool. A lane that passed
      # every control it has and goes red because the page builder tripped is
      # reporting about itself, and the thing it was built to report on is the
      # one nobody would then read.
      - name: sheet
        if: always()
        continue-on-error: true
        run: |
          # The verifier logs, gathered. They sit loose in the home directory --
          # ~/stdgeom.log, ~/themediff.log, ~/deco-a.log and a dozen more -- so
          # every sheet this lane has published carried "logs=0" while the
          # Windows ones carried sixteen. A sheet that cannot show what the lane
          # asserted cannot be read for what the lane asserted twice.
          mkdir -p ~/sheetsrc
          cp ~/*.log ~/sheetsrc/ 2>/dev/null || true
          bash test/sheet.sh macos ~/sheet/macos.html \
            "The suites=$HOME/screenshots" \
            "Logs=$HOME/sheetsrc"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-sheet
          path: ~/sheet/macos.html

  # The netinstall suite, alone. It is the longest single reading in the whole
  # matrix -- one run.sh that nothing here can split -- so it is what every
  # other job is balanced against, and it carries nothing else that a runner
  # would have to wait behind.
  # Measured against a complete run rather than guessed: this lane took 14.3 min measured, almost all of it one step.
  # That figure is from before the suite stopped running neutrino's verifiers,
  # which is a minute of it on this lane; the ceilings below are above the old
  # number and therefore above the new one, and the next complete run is what
  # gets to replace it.
  # Without a job ceiling the default is six hours, which is what a wedged step
  # spends before anyone finds out -- a run that hangs reports nothing, and
  # nothing is the one result no round can act on. A lane that exceeds this has
  # not got slower, it has stopped.
  #
  # The shotroom step is back, for the splash's pictures. The suite stopped
  # photographing the webview -- what it asks of a launch is whether a webview
  # started and ran its script, which is a title and not a photograph -- and the
  # step left with the pictures. splash.sh now takes a portrait of the splash
  # window and six frames of it moving, and without the room cleared first every
  # one of them carries the screen recording alert over the window it is a
  # picture of, which is exactly what the lane's captures looked like before the
  # step existed.
  macos-netinstall:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: the room the picture is taken in
        timeout-minutes: 3
        continue-on-error: true
        run: |
          bash test/shotroom-macos.sh > ~/shotroom.log 2>&1 || true
          cat ~/shotroom.log
      - name: netinstall suite
        timeout-minutes: 30
        run: |
          # Where splash.sh puts its portrait of the splash window and the six
          # frames of it moving; the sheet step below heads them as
          # netinstall's own.
          export NEUTRINO_SPLASH_SHOTS=$HOME/netinstall-screenshots
          # Measured on run 33750772253. See the gjs lane for why it is an
          # assertion and not a report.
          export NEUTRINO_SPLASH_EXPECT=appkit
          bash netinstall/test/run.sh
      # One artifact, one file: this lane's logs and its one picture as a page
      # that opens in a browser, the same page every other lane publishes. The
      # sheet is the one place its assertions can be read without opening a
      # job log.
      #
      # continue-on-error, because this is a reporting tool. A lane that passed
      # every control it has and goes red because the page builder tripped is
      # reporting about itself, and the thing it was built to report on is the
      # one nobody would then read.
      - name: sheet
        if: always()
        continue-on-error: true
        run: |
          # The suite's logs, gathered. They sit loose in the home directory, so
          # every sheet this lane published before they were collected carried
          # "logs=0". A sheet that cannot show what the lane asserted cannot be
          # read for what the lane asserted.
          mkdir -p ~/sheetsrc
          cp ~/*.log ~/sheetsrc/ 2>/dev/null || true
          # The suite's picture and its logs. `The suites=$HOME/screenshots`
          # used to be named here and was never written on this lane -- that
          # directory belongs to the `macos` job -- so the directory named is
          # the one the suite step above pointed splash.sh at, and no other.
          bash test/sheet.sh macos-netinstall ~/sheet/macos-netinstall.html \
            "netinstall=$HOME/netinstall-screenshots" \
            "Logs=$HOME/sheetsrc"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-netinstall-sheet
          path: ~/sheet/macos-netinstall.html
