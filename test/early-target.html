Where test/neutrinoearly.js tries to go, served over loopback by the workflow.

It has no script of its own and does not need any: the preload and the page
script are registered on the engine, so whatever arrives in this view is handed
both. That is the point of the test -- the page that got here inherits the
whole API -- and it is neutrinoearly.js's own report, running in this document,
that says so.

The target used to be a host that never resolves. That was measured and it was
not a test: on the macOS driver the provisional load simply fails, the app's
document is never replaced, and "held" is what a driver with no guard at all
answers. A navigation that cannot arrive proves nothing about a guard.
-->
